name: SSD Hyperscale Automation Framework By Bang Thien Nguyen
# push to main
# Whenever you commit and push code to the main branch, the workflow runs automatically.
# pull_request to main
# Whenever someone opens a pull request targeting the main branch, the workflow runs to check the code before merging.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Runs at 1:00 AM PT every day.
    - cron: '0 8 * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install behave-html-pretty-formatter

      - name: Run Behave Tests
        run: |
          mkdir -p reports
          behave --tags=@adv --exclude "features/manual_tests" --format behave_html_pretty_formatter:PrettyHTMLFormatter -o reports/validation_report.html

      # Upload the report as an artifact to be used by the deployment job
      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-${{ matrix.os }}
          path: reports/validation_report.html
          retention-days: 7

---

  # Deploy job
  deploy:
    # Run the deployment only after the build-and-test job completes successfully on one platform (e.g., ubuntu-latest)
    needs: build-and-test
    # This must match the name of one of the artifacts uploaded in the build-and-test job.
    # We choose ubuntu-latest's artifact for deployment.
    if: success() && github.event.sender.login != 'dependabot[bot]' # Add a condition if needed, or simply 'if: success()'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Download the report artifact from the previous job
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: validation-report-ubuntu-latest # Download the report generated on ubuntu-latest

      # Setup the GitHub Pages environment
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Upload the downloaded artifact (the HTML report) to GitHub Pages.
      # The path should point to the downloaded file. The artifact is typically downloaded
      # to the root of the runner's workspace.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: validation_report.html # The downloaded report file name

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
