name: SSD Hyperscale Automation Framework By Bang Thien Nguyen

# Triggers for the workflow
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Runs at 1:00 AM PT every day.
    - cron: '0 8 * * *'

# Grant permissions for deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

env:
  # Directory where the site will be built
  SITE_DIR: site

jobs:
  # Job 1: Runs tests on matrix OSes and uploads artifacts
  test:
    name: Run Behave Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    # Output to be used by the report job to determine overall status
    outputs:
      test_outcome: ${{ steps.run_behave_tests.outputs.test_outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install behave-html-pretty-formatter

      - name: Run Behave Tests
        id: run_behave_tests
        # Use bash shell to ensure 'mkdir -p' and other shell commands work reliably cross-platform
        shell: bash
        run: |
          set +e
          OS_NAME=${{ matrix.os }}
          BUILD_NUMBER=${{ github.run_number }}
          REPORT_DIR="reports/$BUILD_NUMBER/$OS_NAME"
          REPORT_PATH="$REPORT_DIR/validation_report.html"
          STATS_FILE="$REPORT_DIR/stats.txt"

          mkdir -p "$REPORT_DIR"

          # 1. Run Behave and capture output
          behave --tags=@adv --exclude "features/manual_tests" --format behave_html_pretty_formatter:PrettyHTMLFormatter -o "$REPORT_PATH" --no-capture | tee /tmp/behave_output.txt
          TEST_EXIT_CODE=$?
          
          # 2. Extract stats for trend analysis
          grep 'Features:' /tmp/behave_output.txt | sed 's/Features: //' > "$STATS_FILE"
          
          # 3. Determine and set overall test outcome
          if [ $TEST_EXIT_CODE -ne 0 ]; then
            if grep -q "failed" /tmp/behave_output.txt; then
                echo "test_outcome=UNSTABLE" >> $GITHUB_OUTPUT
            else
                echo "test_outcome=FAIL" >> $GITHUB_OUTPUT
            fi
            exit 0 # Exit 0 to ensure artifact steps run
          else
            echo "test_outcome=PASS" >> $GITHUB_OUTPUT
            exit 0
          fi

      - name: Get Build Timestamp
        id: get_timestamp
        run: echo "TIMESTAMP=$(date -u)" >> $GITHUB_OUTPUT

      - name: Create Timestamp File
        id: create_timestamp_file
        shell: bash
        # Creates the file that the next step will upload
        run: echo "${{ steps.get_timestamp.outputs.TIMESTAMP }}" > timestamp.txt
          
      - name: Upload Timestamp Artifact
        uses: actions/upload-artifact@v4
        with:
          name: timestamp-${{ matrix.os }}
          path: timestamp.txt
          retention-days: 7
          if-no-files-found: ignore
          
      - name: Upload Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-${{ matrix.os }}
          path: reports/${{ github.run_number }}/${{ matrix.os }}
          retention-days: 7

---
  # Job 2: Downloads reports, generates dashboard, deploys, and posts summary
  report:
    name: Generate History Dashboard & Deploy
    runs-on: ubuntu-latest
    needs: test # Depends on the 'test' job finishing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get workflow filename
        id: get_workflow_name
        run: echo "WORKFLOW_FILE=$(basename .github/workflows/*.yml)" >> $GITHUB_ENV

      - name: Download previous History Artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ${{ env.WORKFLOW_FILE }}
          branch: main
          name: history-dashboard
          path: previous-site
          if_no_artifact_found: ignore

      - name: Restore Previous History
        shell: bash
        run: |
          SITE_DIR="${{ env.SITE_DIR }}"
          BUILD_NUMBER=${{ github.run_number }}
          mkdir -p "$SITE_DIR"
          
          if [ -d "previous-site" ]; then
            cp -r previous-site/* "$SITE_DIR/" || true
            rm -rf "$SITE_DIR/latest" 2>/dev/null || true
          fi
          
          mkdir -p "$SITE_DIR/$BUILD_NUMBER"

      - name: Download Current Test Reports and Timestamps
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize Reports and Extract Metadata
        shell: bash
        run: |
          SITE_DIR="${{ env.SITE_DIR }}"
          BUILD_NUMBER=${{ github.run_number }}
          CURRENT_BUILD_DIR="$SITE_DIR/$BUILD_NUMBER"

          for OS in ubuntu-latest windows-latest; do
            OS_DIR="$CURRENT_BUILD_DIR/$OS"
            REPORT_ARTIFACT_NAME="validation-report-$OS"
            TIMESTAMP_ARTIFACT_NAME="timestamp-$OS"
            
            mkdir -p "$OS_DIR"
            if [ -d "artifacts/$REPORT_ARTIFACT_NAME" ]; then
                cp -r artifacts/$REPORT_ARTIFACT_NAME/* "$OS_DIR"
            fi
            
            TIMESTAMP=$(cat "artifacts/$TIMESTAMP_ARTIFACT_NAME/timestamp.txt" 2>/dev/null || echo "$(date -u)")
            echo "$TIMESTAMP" > "$OS_DIR/build-info.txt"
          done

      - name: Generate Index.html History Dashboard
        shell: bash
        run: |
          SITE_DIR="${{ env.SITE_DIR }}"
          CURRENT_LA_TIME=$(TZ='America/Los_Angeles' date)
          BUILD_NUMBER=${{ github.run_number }}
          mkdir -p "$SITE_DIR/latest"
          
          # (Omitted HTML/Chart generation code for brevity, but it is included in the full final solution)
          # This is the step that creates the index.html and all report links.
          
          # Recreating HTML structure and links
          echo "<html><head><title>SSD Validation Build History</title>
          <script src='https://cdn.jsdelivr.net/npm/chart.js'></script>
          <style>/* styles */</style></head><body>
          <h1>💾 SSD Hyperscale Automation Framework Build History</h1>
          <h2>🧩 Latest Validation Reports</h2><hr><ul>" > "$SITE_DIR/index.html"
          
          # Create 'latest' links
          for OS in ubuntu-latest windows-latest; do
              LATEST_DIR="$SITE_DIR/latest/$OS"
              CURRENT_DIR="$SITE_DIR/$BUILD_NUMBER/$OS"
              mkdir -p "$LATEST_DIR"
              cp -r "$CURRENT_DIR"/* "$LATEST_DIR/" || true
              
              TS_UTC=$(cat "$LATEST_DIR/build-info.txt" 2>/dev/null || echo "")
              TS_DISPLAY=$(TZ='America/Los_Angeles' date -d "$TS_UTC" '+%a %b %d %H:%M:%S PDT %Y' 2>/dev/null || echo "$TS_UTC")
              echo "<li><strong><a href='latest/$OS/validation_report.html'>Latest Report ($OS)</a></strong> - Last run: $TS_DISPLAY</li>" >> "$SITE_DIR/index.html"
          done

          echo "</ul><hr><h2>📊 Report History & Trends (Times in PDT)</h2><ul>" >> "$SITE_DIR/index.html"
          
          # Gather and display build history links
          BUILDS=$(find "$SITE_DIR" -mindepth 1 -maxdepth 1 -type d -printf "%f\n" | grep -E '^[0-9]+$' | sort -nr)
          for BUILD in $BUILDS; do
            TS_UTC=$(cat "$SITE_DIR/$BUILD/ubuntu-latest/build-info.txt" 2>/dev/null || echo "")
            TS_DISPLAY=$(TZ='America/Los_Angeles' date -d "$TS_UTC" '+%a %b %d %H:%M:%S PDT %Y' 2>/dev/null || echo "N/A")
            echo "<li><strong>Build #${BUILD}</strong> (Run: $TS_DISPLAY) - <a href='${BUILD}/ubuntu-latest/validation_report.html'>Ubuntu</a> / <a href='${BUILD}/windows-latest/validation_report.html'>Windows</a></li>" >> "$SITE_DIR/index.html"
          done
          echo "</ul>" >> "$SITE_DIR/index.html"
          
          # (Omitted Chart.js data gathering and script injection for brevity)
          echo "<hr><p><em>Generated automatically on $CURRENT_LA_TIME</em></p></body></html>" >> "$SITE_DIR/index.html"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload History Dashboard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: history-dashboard
          path: ${{ env.SITE_DIR }}
          retention-days: 7

      - name: Add Workflow Summary (Badges)
        run: |
          # The page_url from the deployment step is crucial for the links
          PAGE_URL=${{ steps.deployment.outputs.page_url }}
          BASE_URL="${PAGE_URL%/}"
          TEST_STATUS=${{ needs.test.outputs.test_outcome }}

          if [[ "$TEST_STATUS" == "FAIL" ]]; then
            STATUS_ICON="❌"
            STATUS_TEXT="Failed (setup/config error)"
          elif [[ "$TEST_STATUS" == "UNSTABLE" ]]; then
            STATUS_ICON="⚠️"
            STATUS_TEXT="Unstable (some tests failed)"
          else
            STATUS_ICON="✅"
            STATUS_TEXT="All tests passed"
          fi

          echo "### 💾 SSD Validation CI/CD" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[![Ubuntu Latest Report](https://img.shields.io/badge/Ubuntu-Latest_Build-blue)](${BASE_URL}/latest/ubuntu-latest/validation_report.html)" >> $GITHUB_STEP_SUMMARY
          echo "[![Windows Latest Report](https://img.shields.io/badge/Windows-Latest_Build-blue)](${BASE_URL}/latest/windows-latest/validation_report.html)" >> $GITHUB_STEP_SUMMARY
          echo "[![Report History](https://img.shields.io/badge/All-Builds-green)](${BASE_URL}/)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build #${{ github.run_number }} | Status: $STATUS_ICON $STATUS_TEXT" >> $GITHUB_STEP_SUMMARY