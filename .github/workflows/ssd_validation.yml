name: SSD Hyperscale Automation Framework By Bang Thien Nguyen

# Triggers for the workflow
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Runs at 1:00 AM PT every day.
    - cron: '0 8 * * *'

# 🔑 CRUCIAL: Grants permissions needed for deploying to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

env:
  # Directory where the site will be built
  SITE_DIR: site

jobs:
  # Job 1: Runs tests on matrix OSes and uploads artifacts
  test: 
    name: Run Behave Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    outputs:
      test_outcome: ${{ steps.run_behave_tests.outputs.test_outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install behave-html-pretty-formatter

      - name: Run Behave Tests
        id: run_behave_tests
        # FIX: Use bash shell for cross-platform compatibility
        shell: bash
        run: |
          set +e
          OS_NAME=${{ matrix.os }}
          BUILD_NUMBER=${{ github.run_number }}
          REPORT_DIR="reports/$BUILD_NUMBER/$OS_NAME"
          REPORT_PATH="$REPORT_DIR/validation_report.html"
          STATS_FILE="$REPORT_DIR/stats.txt"

          mkdir -p "$REPORT_DIR"

          behave --tags=@adv --exclude "features/manual_tests" --format behave_html_pretty_formatter:PrettyHTMLFormatter -o "$REPORT_PATH" --no-capture | tee /tmp/behave_output.txt
          TEST_EXIT_CODE=$?
          
          grep 'Features:' /tmp/behave_output.txt | sed 's/Features: //' > "$STATS_FILE"
          
          if [ $TEST_EXIT_CODE -ne 0 ]; then
            if grep -q "failed" /tmp/behave_output.txt; then
                echo "test_outcome=UNSTABLE" >> $GITHUB_OUTPUT
            else
                echo "test_outcome=FAIL" >> $GITHUB_OUTPUT
            fi
            exit 0
          else
            echo "test_outcome=PASS" >> $GITHUB_OUTPUT
            exit 0
          fi

      - name: Get Build Timestamp
        id: get_timestamp
        run: echo "TIMESTAMP=$(date -u)" >> $GITHUB_OUTPUT

      - name: Create Timestamp File
        id: create_timestamp_file
        shell: bash
        run: echo "${{ steps.get_timestamp.outputs.TIMESTAMP }}" > timestamp.txt
          
      - name: Upload Timestamp Artifact
        uses: actions/upload-artifact@v4
        with:
          name: timestamp-${{ matrix.os }}
          path: timestamp.txt
          retention-days: 7
          if-no-files-found: ignore
          
      - name: Upload Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-${{ matrix.os }}
          path: reports/${{ github.run_number }}/${{ matrix.os }}
          retention-days: 7

  # Job 2: Generates Dashboard and Deploys
  report:
    name: Generate History Dashboard & Deploy
    runs-on: ubuntu-latest
    needs: test 
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 👇 Restore previous history, collect artifacts, generate dashboard
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build History Dashboard
        shell: bash
        run: |
          mkdir -p site
          echo "<html><head><title>SSD Hyperscale Automation Framework</title></head><body>" > site/index.html
          echo "<h1>💾 SSD Hyperscale Automation Framework Build History</h1>" >> site/index.html
          echo "<p><strong>Author:</strong> Bang Thien Nguyen</p>" >> site/index.html
          echo "<hr><ul>" >> site/index.html
          for OS in ubuntu-latest windows-latest; do
            mkdir -p site/latest/$OS
            cp -r artifacts/validation-report-$OS/* site/latest/$OS/ || true
            echo "<li><a href='latest/$OS/validation_report.html'>Latest report for $OS</a></li>" >> site/index.html
          done
          echo "</ul><hr><p>Generated: $(TZ='America/Los_Angeles' date)</p></body></html>" >> site/index.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ✅ FIX: Add clear workflow summary with badges
      - name: Add Workflow Summary (Badges)
        if: always()
        run: |
          PAGE_URL="${{ steps.deployment.outputs.page_url }}"
          TEST_RESULT="${{ needs.test.outputs.test_outcome }}"
          BASE_URL="${PAGE_URL%/}"

          echo "### 💾 SSD Validation CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[![Ubuntu Report](https://img.shields.io/badge/Ubuntu-Latest_Report-blue)](${BASE_URL}/latest/ubuntu-latest/validation_report.html)" >> $GITHUB_STEP_SUMMARY
          echo "[![Windows Report](https://img.shields.io/badge/Windows-Latest_Report-blue)](${BASE_URL}/latest/windows-latest/validation_report.html)" >> $GITHUB_STEP_SUMMARY
          echo "[![All Builds](https://img.shields.io/badge/View-History-green)](${BASE_URL}/)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build #${{ github.run_number }} – Result:** ${TEST_RESULT}" >> $GITHUB_STEP_SUMMARY
