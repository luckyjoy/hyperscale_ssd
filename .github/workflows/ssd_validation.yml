name: SSD Hyperscale Automation Framework By Bang Thien Nguyen

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: 🧪 SSD Validation
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .
      ALLURE_RESULTS: allure-results
      ALLURE_REPORT: allure-report
      DOCKER_BUILDKIT: 1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest allure-pytest

      - name: Build Docker Image
        run: |
          echo "[Docker Build Status] Step 1/3 (33%) Task: Building Image..."
          docker build -t ssd-validation:latest .

      - name: Run Tests (Pytest + Allure)
        id: tests
        run: |
          mkdir -p $ALLURE_RESULTS
          pytest --maxfail=1 --disable-warnings -q --alluredir=$ALLURE_RESULTS || echo "TESTS_FAILED=true" >> $GITHUB_ENV

      - name: Generate Allure Report
        if: always()
        run: |
          allure generate $ALLURE_RESULTS --clean -o $ALLURE_REPORT || echo "ALLURE_GEN_FAILED=true" >> $GITHUB_ENV

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: ${{ env.ALLURE_REPORT }}

      - name: Determine Build Status
        id: build_status
        run: |
          echo "Evaluating build result..."
          if [ "${{ env.TESTS_FAILED }}" = "true" ]; then
            echo "BUILD_STATUS=UNSTABLE" >> $GITHUB_ENV
            echo "⚠️ UNSTABLE - Environment okay but one or more tests failed."
          elif [ "${{ env.ALLURE_GEN_FAILED }}" = "true" ]; then
            echo "BUILD_STATUS=FAIL" >> $GITHUB_ENV
            echo "❌ FAIL - Report generation or setup failure."
          else
            echo "BUILD_STATUS=PASS" >> $GITHUB_ENV
            echo "✅ PASS - Everything succeeded."
          fi

      - name: Upload Build Summary
        if: always()
        run: |
          echo "## 🧾 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ env.BUILD_STATUS }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

      - name: Save History Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-data
          path: allure-results/history

  publish-trend:
    name: 📈 Update History Dashboard
    needs: [ build-and-test ]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Download History Artifacts
        uses: actions/download-artifact@v4
        with:
          name: history-data
          path: allure-results/history

      - name: Merge History (Allure)
        run: |
          mkdir -p allure-results
          echo "Merging historical data..."
          if [ -d "allure-results/history" ]; then
            cp -r allure-results/history allure-results/ || true
          fi

      - name: Publish Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages
