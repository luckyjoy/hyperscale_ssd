name: SSD Hyperscale Automation Framework By Bang Thien Nguyen

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 8 * * *'  # 1:00 AM PT daily

permissions:
  contents: write
  pages: write
  id-token: write

env:
  SITE_DIR: site
  HISTORY_FILE: site/history.json

jobs:
  test:
    name: Run Behave Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    outputs:
      test_outcome: ${{ steps.run_behave_tests.outputs.test_outcome }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install behave-html-pretty-formatter

      - name: Run Behave Tests
        id: run_behave_tests
        shell: bash
        run: |
          set +e
          OS_NAME=${{ matrix.os }}
          BUILD_NUMBER=${{ github.run_number }}
          REPORT_DIR="reports/$BUILD_NUMBER/$OS_NAME"
          REPORT_PATH="$REPORT_DIR/validation_report.html"
          STATS_FILE="$REPORT_DIR/stats.txt"

          mkdir -p "$REPORT_DIR"
          behave --tags=@adv --exclude "features/manual_tests" \
            --format behave_html_pretty_formatter:PrettyHTMLFormatter \
            -o "$REPORT_PATH" --no-capture | tee /tmp/behave_output.txt
          TEST_EXIT_CODE=$?

          grep 'Features:' /tmp/behave_output.txt | sed 's/Features: //' > "$STATS_FILE"

          # Determine result based on your PASS/UNSTABLE/FAIL policy
          if [ $TEST_EXIT_CODE -ne 0 ]; then
            if grep -q "failed" /tmp/behave_output.txt; then
                RESULT=UNSTABLE
            else
                RESULT=FAIL
            fi
          else
            RESULT=PASS
          fi

          echo "test_outcome=$RESULT" >> $GITHUB_OUTPUT
          exit 0

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-${{ matrix.os }}
          path: reports/${{ github.run_number }}/${{ matrix.os }}

  report:
    name: Generate History Dashboard & Deploy
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Restore existing history (if any)
        run: |
          mkdir -p ${{ env.SITE_DIR }}
          if [ -f ${{ env.HISTORY_FILE }} ]; then
            echo "Existing history found"
          else
            echo "[]" > ${{ env.HISTORY_FILE }}
          fi

      - name: Update build history JSON
        id: update_history
        run: |
          BUILD_NUM=${{ github.run_number }}
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RESULT="${{ needs.test.outputs.test_outcome }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          jq --arg build "$BUILD_NUM" \
             --arg result "$RESULT" \
             --arg time "$TIMESTAMP" \
             --arg url "$RUN_URL" \
             '. += [{"build": ($build|tonumber), "result": $result, "time": $time, "url": $url}]' \
             ${{ env.HISTORY_FILE }} > temp.json
          mv temp.json ${{ env.HISTORY_FILE }}

      - name: Build dashboard HTML
        run: |
          SITE=${{ env.SITE_DIR }}
          mkdir -p "$SITE/latest"
          HISTORY=${{ env.HISTORY_FILE }}

          echo "<!DOCTYPE html><html><head><meta charset='UTF-8'>" > "$SITE/index.html"
          echo "<title>SSD Validation Dashboard</title>" >> "$SITE/index.html"
          echo "<script src='https://cdn.jsdelivr.net/npm/chart.js'></script>" >> "$SITE/index.html"
          echo "<style>body{font-family:Segoe UI,Arial;margin:40px;}canvas{max-width:800px;}h2{border-bottom:1px solid #ccc;}a{text-decoration:none;color:#1565C0;}.legend{display:inline-block;margin-right:10px;padding:4px 8px;border-radius:4px;}.pass{background:#4CAF50;color:white;}.fail{background:#F44336;color:white;}.unstable{background:#FFC107;color:black;}</style></head><body>" >> "$SITE/index.html"

          echo "<h2>🌿 SSD Hyperscale Automation Framework</h2>" >> "$SITE/index.html"
          echo "<p>Last updated: $(TZ='America/Los_Angeles' date '+%a %b %d %T PDT %Y')</p>" >> "$SITE/index.html"

          echo "<div><span class='legend pass'>PASS</span><span class='legend fail'>FAIL</span><span class='legend unstable'>UNSTABLE</span></div>" >> "$SITE/index.html"
          echo "<canvas id='trendChart'></canvas>" >> "$SITE/index.html"

          echo "<script>" >> "$SITE/index.html"
          echo "fetch('history.json').then(r=>r.json()).then(data=>{" >> "$SITE/index.html"
          echo "data.sort((a,b)=>a.build-b.build);" >> "$SITE/index.html"
          echo "const builds=data.map(d=>d.build);" >> "$SITE/index.html"
          echo "const passCounts=data.map((d,i)=>data.slice(0,i+1).filter(x=>x.result==='PASS').length);" >> "$SITE/index.html"
          echo "const failCounts=data.map((d,i)=>data.slice(0,i+1).filter(x=>x.result==='FAIL').length);" >> "$SITE/index.html"
          echo "const unstableCounts=data.map((d,i)=>data.slice(0,i+1).filter(x=>x.result==='UNSTABLE').length);" >> "$SITE/index.html"
          echo "new Chart(document.getElementById('trendChart'),{type:'line',data:{labels:builds,datasets:[" >> "$SITE/index.html"
          echo "{label:'PASS',data:passCounts,borderColor:'#4CAF50',tension:0.1,fill:false}," >> "$SITE/index.html"
          echo "{label:'FAIL',data:failCounts,borderColor:'#F44336',tension:0.1,fill:false}," >> "$SITE/index.html"
          echo "{label:'UNSTABLE',data:unstableCounts,borderColor:'#FFC107',tension:0.1,fill:false}" >> "$SITE/index.html"
          echo "]},options:{plugins:{legend:{display:true}},scales:{x:{title:{display:true,text:'Build #'}},y:{title:{display:true,text:'Cumulative Count'}}}}});" >> "$SITE/index.html"
          echo "});</script>" >> "$SITE/index.html"

          echo "<h3>Latest Reports</h3><ul>" >> "$SITE/index.html"
          for OS in ubuntu-latest windows-latest; do
            mkdir -p "$SITE/latest/$OS"
            cp -r artifacts/validation-report-$OS/* "$SITE/latest/$OS/" || true
            echo "<li><a href='latest/$OS/validation_report.html'>Latest Report ($OS)</a></li>" >> "$SITE/index.html"
          done
          echo "</ul><p style='font-size:12px;color:#777;'>Generated $(TZ='America/Los_Angeles' date)</p></body></html>" >> "$SITE/index.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Workflow summary with badges
        if: always()
        run: |
          PAGE_URL="${{ steps.deployment.outputs.page_url }}"
          echo "### 💾 SSD Validation CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "[![Ubuntu Report](https://img.shields.io/badge/Ubuntu-Latest-blue)](${PAGE_URL}/latest/ubuntu-latest/validation_report.html)" >> $GITHUB_STEP_SUMMARY
          echo "[![Windows Report](https://img.shields.io/badge/Windows-Latest-blue)](${PAGE_URL}/latest/windows-latest/validation_report.html)" >> $GITHUB_STEP_SUMMARY
          echo "[![History](https://img.shields.io/badge/View-History-green)](${PAGE_URL}/)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build #${{ github.run_number }} Result:** ${{ needs.test.outputs.test_outcome }}" >> $GITHUB_STEP_SUMMARY
