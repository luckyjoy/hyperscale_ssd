name: Hyperscale SSD Framework CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  SITE_DIR: site

jobs:
  test:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    outputs:
      test_outcome: ${{ steps.set_outcome.outputs.test_outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-json-report

      - name: Run Tests
        id: run_tests
        run: |
          mkdir -p test-results
          pytest --json-report --json-report-file=test-results/report.json || echo "Tests completed with errors"

      - name: Determine test outcome
        id: set_outcome
        shell: bash
        run: |
          REPORT="test-results/report.json"
          if [ ! -f "$REPORT" ]; then
            echo "test_outcome=FAIL" >> $GITHUB_OUTPUT
            exit 0
          fi

          FAIL_COUNT=$(jq '.summary.failed' "$REPORT")
          ERROR_COUNT=$(jq '.summary.errors' "$REPORT")
          PASS_COUNT=$(jq '.summary.passed' "$REPORT")

          if (( FAIL_COUNT > 0 || ERROR_COUNT > 0 )); then
            echo "test_outcome=UNSTABLE" >> $GITHUB_OUTPUT
          elif (( PASS_COUNT > 0 )); then
            echo "test_outcome=PASS" >> $GITHUB_OUTPUT
          else
            echo "test_outcome=FAIL" >> $GITHUB_OUTPUT
          fi

      - name: Save test artifacts
        run: |
          BUILD_DIR="${SITE_DIR}/${GITHUB_RUN_NUMBER}/${{ matrix.os }}"
          mkdir -p "$BUILD_DIR"
          cp test-results/report.json "$BUILD_DIR/"
          date -u > "$BUILD_DIR/build-info.txt"

      - name: Save latest pointer
        if: always()
        run: |
          LATEST_DIR="${SITE_DIR}/latest/${{ matrix.os }}"
          mkdir -p "$LATEST_DIR"
          cp -r test-results/* "$LATEST_DIR/"
          date -u > "$LATEST_DIR/build-info.txt"

  build_dashboard:
    name: Build Dashboard
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download previous artifacts
        uses: actions/download-artifact@v4
        with:
          path: site

      - name: Rebuild index.html with Trend Charts
        shell: bash
        run: |
          SITE_DIR="site"
          CURRENT_LA_TIME=$(TZ='America/Los_Angeles' date)
          mkdir -p "$SITE_DIR"

          echo "<html><head><title>Hyperscale SSD Framework Reports History</title>
          <script src='https://cdn.jsdelivr.net/npm/chart.js'></script>
          <style>
          body{font-family:sans-serif;margin:20px;}
          ul{list-style:none;padding:0;}
          li{margin:6px 0;}
          a{text-decoration:none;color:#0366d6;}
          a:hover{text-decoration:underline;}
          #chart-container{max-width:600px;max-height:300px;margin:0;}
          </style></head><body>
          <h1>🤖 Hyperscale SSD Framework CI/CD Build History</h1>
          <h2>🧩 Latest Reports</h2><hr><ul>" > "$SITE_DIR/index.html"

          for OS in ubuntu-latest windows-latest; do
            if [ -d "$SITE_DIR/latest/$OS" ]; then
              TS_UTC=$(cat "$SITE_DIR/latest/$OS/build-info.txt" 2>/dev/null || echo "")
              TS_DISPLAY=$(TZ='America/Los_Angeles' date -d "$TS_UTC" '+%a %b %d %H:%M:%S PDT %Y' 2>/dev/null || echo "$TS_UTC")
              echo "<li><strong><a href='latest/$OS/report.json'>Latest Report ($OS)</a></strong> - Last run: $TS_DISPLAY</li>" >> "$SITE_DIR/index.html"
            else
              echo "<li><strong>$OS:</strong> (No report found)</li>" >> "$SITE_DIR/index.html"
            fi
          done

          echo "</ul><hr><h2>📊 Report History & Trends (Times in PDT)</h2>" >> "$SITE_DIR/index.html"
          BUILDS=$(find "$SITE_DIR" -mindepth 1 -maxdepth 1 -type d -printf "%f\n" | grep -E '^[0-9]+$' | sort -nr)
          echo "<ul>" >> "$SITE_DIR/index.html"

          CHART_BUILDS=$(echo "$BUILDS" | sort -n)
          LABELS=""
          PASS_COUNTS=""
          FAIL_COUNTS=""
          UNSTABLE_COUNTS=""

          for BUILD in $BUILDS; do
            TS_UTC=$(cat "$SITE_DIR/$BUILD/ubuntu-latest/build-info.txt" 2>/dev/null || echo "")
            TS_DISPLAY=$(TZ='America/Los_Angeles' date -d "$TS_UTC" '+%a %b %d %H:%M:%S PDT %Y' 2>/dev/null || echo "N/A")
            echo "<li><strong>Build #${BUILD}</strong> (Run: $TS_DISPLAY) - <a href='${BUILD}/ubuntu-latest/report.json'>Ubuntu</a> / <a href='${BUILD}/windows-latest/report.json'>Windows</a></li>" >> "$SITE_DIR/index.html"
          done

          echo "</ul>" >> "$SITE_DIR/index.html"

          for BUILD in $CHART_BUILDS; do
            TOTAL_PASS=0
            TOTAL_FAIL=0
            TOTAL_UNSTABLE=0

            for OS in ubuntu-latest windows-latest; do
              REPORT_FILE="$SITE_DIR/$BUILD/$OS/report.json"
              if [ -f "$REPORT_FILE" ]; then
                PASS=$(jq '.summary.passed' "$REPORT_FILE" 2>/dev/null || echo 0)
                FAIL=$(jq '.summary.failed' "$REPORT_FILE" 2>/dev/null || echo 0)
                ERROR=$(jq '.summary.errors' "$REPORT_FILE" 2>/dev/null || echo 0)

                TOTAL_PASS=$((TOTAL_PASS + PASS))
                TOTAL_FAIL=$((TOTAL_FAIL + FAIL))
                TOTAL_UNSTABLE=$((TOTAL_UNSTABLE + ERROR))
              fi
            done

            LABELS="$LABELS'$BUILD',"
            PASS_COUNTS="$PASS_COUNTS$TOTAL_PASS,"
            FAIL_COUNTS="$FAIL_COUNTS$TOTAL_FAIL,"
            UNSTABLE_COUNTS="$UNSTABLE_COUNTS$TOTAL_UNSTABLE,"
          done

          echo "<div id='chart-container'><canvas id='trendChart'></canvas></div>
          <script>
          const ctx = document.getElementById('trendChart').getContext('2d');
          new Chart(ctx, {
            type: 'line',
            data: {
              labels: [${LABELS%,}],
              datasets: [
                {label: 'PASS', data: [${PASS_COUNTS%,}], borderColor: 'green', fill: false},
                {label: 'FAIL', data: [${FAIL_COUNTS%,}], borderColor: 'red', fill: false},
                {label: 'UNSTABLE', data: [${UNSTABLE_COUNTS%,}], borderColor: 'orange', fill: false}
              ]
            },
            options: {responsive:true, maintainAspectRatio:false,
              plugins:{legend:{position:'top'}},
              scales:{
                y:{beginAtZero:true, title:{display:true, text:'Total Tests'}},
                x:{title:{display:true, text:'Build Number'}}
              }
            }
          });
          </script>
          <hr><p><em>Generated on $CURRENT_LA_TIME</em></p></body></html>" >> "$SITE_DIR/index.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Workflow summary with badges
        if: always()
        run: |
          PAGE_URL="${{ steps.deployment.outputs.page_url }}"
          echo "### 💾 Hyperscale SSD Framework CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "[![Ubuntu Report](https://img.shields.io/badge/Ubuntu-Latest-blue)](${PAGE_URL}/latest/ubuntu-latest/report.json)" >> $GITHUB_STEP_SUMMARY
          echo "[![Windows Report](https://img.shields.io/badge/Windows-Latest-blue)](${PAGE_URL}/latest/windows-latest/report.json)" >> $GITHUB_STEP_SUMMARY
          echo "[![History](https://img.shields.io/badge/View-History-green)](${PAGE_URL}/)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build #${{ github.run_number }} Result:** ${{ needs.test.outputs.test_outcome }}" >> $GITHUB_STEP_SUMMARY
