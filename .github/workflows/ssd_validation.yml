report:
    name: Generate History Dashboard & Deploy
    runs-on: ubuntu-latest
    # Needs the test job output to know the overall status
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Get workflow filename for artifact download
      - name: Get workflow filename
        id: get_workflow_name
        run: echo "WORKFLOW_FILE=$(basename .github/workflows/*.yml)" >> $GITHUB_ENV

      # Download previous site history (which contains all past builds)
      - name: Download previous History Artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ${{ env.WORKFLOW_FILE }}
          branch: main
          name: history-dashboard
          path: previous-site
          if_no_artifact_found: ignore

      - name: Restore Previous History
        shell: bash
        run: |
          SITE_DIR="${{ env.SITE_DIR }}"
          BUILD_NUMBER=${{ github.run_number }}
          mkdir -p "$SITE_DIR"
          
          if [ -d "previous-site" ]; then
            echo "♻️ Restoring previous site history..."
            cp -r previous-site/* "$SITE_DIR/" || true
            rm -rf "$SITE_DIR/latest" 2>/dev/null || true
          fi
          
          mkdir -p "$SITE_DIR/$BUILD_NUMBER"

      # Download current build reports
      - name: Download Current Test Reports
        uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Download Timestamps
        uses: actions/download-artifact@v4
        with:
          path: timestamps
          pattern: timestamp-*

      - name: Organize Reports and Extract Metadata
        shell: bash
        run: |
          SITE_DIR="${{ env.SITE_DIR }}"
          BUILD_NUMBER=${{ github.run_number }}
          CURRENT_BUILD_DIR="$SITE_DIR/$BUILD_NUMBER"

          for OS in ubuntu-latest windows-latest; do
            OS_DIR="$CURRENT_BUILD_DIR/$OS"
            REPORT_ARTIFACT_NAME="validation-report-$OS"
            TIMESTAMP_ARTIFACT_NAME="timestamp-$OS"
            
            mkdir -p "$OS_DIR"
            if [ -d "reports/$REPORT_ARTIFACT_NAME" ]; then
                cp -r reports/$REPORT_ARTIFACT_NAME/* "$OS_DIR"
            fi
            
            TIMESTAMP=$(cat "timestamps/$TIMESTAMP_ARTIFACT_NAME/timestamp.txt" 2>/dev/null || echo "$(date -u)")
            echo "$TIMESTAMP" > "$OS_DIR/build-info.txt"
          done

      - name: Generate Index.html History Dashboard
        shell: bash
        run: |
          SITE_DIR="${{ env.SITE_DIR }}"
          CURRENT_LA_TIME=$(TZ='America/Los_Angeles' date)
          BUILD_NUMBER=${{ github.run_number }}
          mkdir -p "$SITE_DIR/latest"

          echo "<html><head><title>SSD Validation Build History</title>
          <script src='https://cdn.jsdelivr.net/npm/chart.js'></script>
          <style>
          body{font-family:sans-serif;margin:20px;}
          ul{list-style:none;padding:0;}
          li{margin:6px 0;}
          a{text-decoration:none;color:#0366d6;}
          a:hover{text-decoration:underline;}
          #chart-container {
            max-width: 800px;
            max-height: 400px;
            margin: 0;
          }
          </style></head><body>
          <h1>💾 SSD Hyperscale Automation Framework Build History</h1>
          <h2>🧩 Latest Validation Reports</h2><hr><ul>" > "$SITE_DIR/index.html"
          
          for OS in ubuntu-latest windows-latest; do
              LATEST_DIR="$SITE_DIR/latest/$OS"
              CURRENT_DIR="$SITE_DIR/$BUILD_NUMBER/$OS"
              mkdir -p "$LATEST_DIR"
              cp -r "$CURRENT_DIR"/* "$LATEST_DIR/" || true
              
              TS_UTC=$(cat "$LATEST_DIR/build-info.txt" 2>/dev/null || echo "")
              TS_DISPLAY=$(TZ='America/Los_Angeles' date -d "$TS_UTC" '+%a %b %d %H:%M:%S PDT %Y' 2>/dev/null || echo "$TS_UTC")
              echo "<li><strong><a href='latest/$OS/validation_report.html'>Latest Report ($OS)</a></strong> - Last run: $TS_DISPLAY</li>" >> "$SITE_DIR/index.html"
          done

          echo "</ul><hr><h2>📊 Report History & Trends (Times in PDT)</h2>" >> "$SITE_DIR/index.html"
          
          BUILDS=$(find "$SITE_DIR" -mindepth 1 -maxdepth 1 -type d -printf "%f\n" | grep -E '^[0-9]+$' | sort -nr)
          
          echo "<ul>" >> "$SITE_DIR/index.html"
          CHART_BUILDS=$(echo "$BUILDS" | sort -n)
          LABELS=""
          PASS_COUNTS=""
          FAIL_COUNTS=""
          
          for BUILD in $BUILDS; do
            TS_UTC=$(cat "$SITE_DIR/$BUILD/ubuntu-latest/build-info.txt" 2>/dev/null || echo "")
            TS_DISPLAY=$(TZ='America/Los_Angeles' date -d "$TS_UTC" '+%a %b %d %H:%M:%S PDT %Y' 2>/dev/null || echo "N/A")

            echo "<li><strong>Build #${BUILD}</strong> (Run: $TS_DISPLAY) - <a href='${BUILD}/ubuntu-latest/validation_report.html'>Ubuntu</a> / <a href='${BUILD}/windows-latest/validation_report.html'>Windows</a></li>" >> "$SITE_DIR/index.html"
          done
          echo "</ul>" >> "$SITE_DIR/index.html"
          
          for BUILD in $CHART_BUILDS; do
            TOTAL_PASS=0
            TOTAL_FAIL=0
            
            for OS in ubuntu-latest windows-latest; do
              STATS_FILE="$SITE_DIR/$BUILD/$OS/stats.txt"
              if [ -f "$STATS_FILE" ]; then
                PASS_COUNT=$(grep -oE '[0-9]+ passed' "$STATS_FILE" | awk '{print $1}")
                FAIL_COUNT=$(grep -oE '[0-9]+ failed' "$STATS_FILE" | awk '{print $1}")
                
                TOTAL_PASS=$((TOTAL_PASS + PASS_COUNT))
                TOTAL_FAIL=$((TOTAL_FAIL + FAIL_COUNT))
              fi
            done
            
            LABELS="$LABELS'$BUILD',"
            PASS_COUNTS="$PASS_COUNTS$TOTAL_PASS,"
            FAIL_COUNTS="$FAIL_COUNTS$TOTAL_FAIL,"
          done

          echo "<div id='chart-container'>
          <canvas id='trendChart'></canvas>
          </div>
          <script>
          const ctx = document.getElementById('trendChart').getContext('2d');
          new Chart(ctx, {
            type: 'line',
            data: {
              labels: [${LABELS%,}],
              datasets: [
                {label: 'PASS', data: [${PASS_COUNTS%,}], borderColor: 'green', backgroundColor: 'rgba(0, 128, 0, 0.2)', fill: false},
                {label: 'FAIL', data: [${FAIL_COUNTS%,}], borderColor: 'red', backgroundColor: 'rgba(255, 0, 0, 0.2)', fill: false}
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { position: 'top' } },
              scales: {
                y: {
                  beginAtZero: true,
                  title: { display: true, text: 'Total Passed Features/Scenarios' }
                },
                x: {
                  title: { display: true, text: 'Build Number' }
                }
              }
            }
          });
          </script>
          <hr><p><em>Generated automatically on $CURRENT_LA_TIME</em></p></body></html>" >> "$SITE_DIR/index.html"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Upload the entire site directory as the history artifact for the next run
      - name: Upload History Dashboard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: history-dashboard
          path: ${{ env.SITE_DIR }}
          retention-days: 7

      # ----------------------------------------------
      # 🚀 MISSING STEP RESTORED: Add Workflow Summary
      # ----------------------------------------------
      - name: Add Workflow Summary (Badges)
        # This step runs after deployment to ensure we have the page_url
        run: |
          PAGE_URL=${{ steps.deployment.outputs.page_url }}
          BASE_URL="${PAGE_URL%/}"
          TEST_STATUS=${{ needs.test.outputs.test_outcome }}

          if [[ "$TEST_STATUS" == "FAIL" ]]; then
            STATUS_ICON="❌"
            STATUS_TEXT="Failed (setup/config error)"
          elif [[ "$TEST_STATUS" == "UNSTABLE" ]]; then
            STATUS_ICON="⚠️"
            STATUS_TEXT="Unstable (some tests failed)"
          else
            STATUS_ICON="✅"
            STATUS_TEXT="All tests passed"
          fi

          echo "### 💾 SSD Validation CI/CD" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[![Ubuntu Latest Report](https://img.shields.io/badge/Ubuntu-Latest_Build-blue)](${BASE_URL}/latest/ubuntu-latest/validation_report.html)" >> $GITHUB_STEP_SUMMARY
          echo "[![Windows Latest Report](https://img.shields.io/badge/Windows-Latest_Build-blue)](${BASE_URL}/latest/windows-latest/validation_report.html)" >> $GITHUB_STEP_SUMMARY
          echo "[![Report History](https://img.shields.io/badge/All-Builds-green)](${BASE_URL}/)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build #${{ github.run_number }} | Status: $STATUS_ICON $STATUS_TEXT" >> $GITHUB_STEP_SUMMARY