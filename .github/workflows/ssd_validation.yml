name: Hyperscale SSD Framework CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  SITE_DIR: site
  REPORT_FILE_NAME: validation_report.html # Define standard report name

jobs:
  test:
    name: Run Behave Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # Ensure Windows and Ubuntu run even if one fails
      matrix:
        os: [ubuntu-latest, windows-latest]

    outputs:
      test_outcome: ${{ steps.run_behave_tests.outputs.test_outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Install Behave and the HTML formatter
          pip install behave behave-html-pretty-formatter

      - name: Run Behave Tests & Capture Reports
        id: run_behave_tests
        shell: bash
        run: |
          set +e # Do not fail the step immediately on test failures
          
          REPORT_DIR="current-reports"
          mkdir -p "$REPORT_DIR"
          REPORT_PATH="$REPORT_DIR/${{ env.REPORT_FILE_NAME }}"
          STATS_FILE="$REPORT_DIR/stats.txt"
          
          echo "Running behave tests..."
          # Run Behave and pipe output to a file
          behave --tags=@adv --exclude "features/manual_tests" \
            --format behave_html_pretty_formatter:PrettyHTMLFormatter \
            -o "$REPORT_PATH" --no-capture | tee /tmp/behave_output.txt
          
          TEST_EXIT_CODE=$?
          
          # Extract features summary line (e.g., "Features: 3 passed, 1 failed, 0 skipped...")
          grep 'Features:' /tmp/behave_output.txt | sed 's/Features: //' > "$STATS_FILE" || true

          # Determine outcome for output variable
          if [ $TEST_EXIT_CODE -ne 0 ]; then
            if grep -q "failed" /tmp/behave_output.txt; then
                RESULT=UNSTABLE
            else
                RESULT=FAIL # Config or setup error
            fi
          else
            RESULT=PASS
          fi
          
          echo "test_outcome=$RESULT" >> $GITHUB_OUTPUT
          
          # Create timestamp file in the reports directory
          date -u > "$REPORT_DIR/build-info.txt"

      # Upload a single artifact containing the report, stats, and timestamp for the dashboard
      # ARTIFACT NAME MODIFIED: Now unique per OS to prevent 409 Conflict
      - name: Upload Current Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: current-build-reports-${{ matrix.os }}
          path: current-reports/
          retention-days: 7


  report:
    name: Build Dashboard & Deploy
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Download previous site artifacts (historical data)
      # MODIFIED: Added continue-on-error to allow the workflow to proceed if 'site' artifact doesn't exist (e.g., first run).
      - name: Download Historical Artifacts
        uses: actions/download-artifact@v4
        with:
          name: site
          path: ${{ env.SITE_DIR }}
        continue-on-error: true
          
      # 2. Download current build artifacts (now split by OS)
      - name: Download Ubuntu Reports
        uses: actions/download-artifact@v4
        with:
          name: current-build-reports-ubuntu-latest
          path: current-reports/ubuntu-latest/

      - name: Download Windows Reports
        uses: actions/download-artifact@v4
        with:
          name: current-build-reports-windows-latest
          path: current-reports/windows-latest/


      - name: Organize Reports and Rebuild Site Structure
        shell: bash
        run: |
          SITE_DIR="${{ env.SITE_DIR }}"
          REPORT_NAME="${{ env.REPORT_FILE_NAME }}"
          CURRENT_BUILD="${{ github.run_number }}"
          
          # Ensure SITE_DIR exists
          mkdir -p "$SITE_DIR"
          
          # --- Process and integrate current build reports ---
          # Iterating through OSes, now looking in their dedicated download folders
          for OS in ubuntu-latest windows-latest; do
            # Source directory is now specific to the OS download
            SOURCE_DIR="current-reports/$OS"
            TARGET_DIR="$SITE_DIR/$CURRENT_BUILD/$OS"
            LATEST_DIR="$SITE_DIR/latest/$OS"
            
            # Create historical and latest directories
            mkdir -p "$TARGET_DIR"
            mkdir -p "$LATEST_DIR"

            # Check if files exist in the dedicated OS folder
            if [ -f "$SOURCE_DIR/stats.txt" ]; then
                
                # Copy to Historical Folder
                cp "$SOURCE_DIR/${REPORT_NAME}" "$TARGET_DIR/" || true
                cp "$SOURCE_DIR/stats.txt" "$TARGET_DIR/" || true
                cp "$SOURCE_DIR/build-info.txt" "$TARGET_DIR/" || true

                # Copy to Latest Pointer Folder
                cp "$SOURCE_DIR/${REPORT_NAME}" "$LATEST_DIR/" || true
                cp "$SOURCE_DIR/stats.txt" "$LATEST_DIR/" || true
                cp "$SOURCE_DIR/build-info.txt" "$LATEST_DIR/" || true
            fi
          done


      - name: Rebuild index.html with Trend Charts
        shell: bash
        run: |
          SITE_DIR="${{ env.SITE_DIR }}"
          REPORT_NAME="${{ env.REPORT_FILE_NAME }}"
          CURRENT_LA_TIME=$(TZ='America/Los_Angeles' date)
          
          # --- Start HTML Generation using printf to safely initialize the file (No Here Document) ---
          printf "<html>\n<head>\n<title>Hyperscale SSD Framework Reports History</title>\n<script src='https://cdn.jsdelivr.net/npm/chart.js'></script>\n<style>\nbody{font-family:sans-serif;margin:20px;}\nul{list-style:none;padding:0;}\nli{margin:6px 0;}\na{text-decoration:none;color:#0366d6;}\na:hover{text-decoration:underline;}\n#chart-container{max-width:600px;max-height:300px;margin:0;}\n</style>\n</head>\n<body>\n<h1>🤖 Hyperscale SSD Framework CI/CD Build History</h1>\n<h2>🧩 Latest Reports (HTML)</h2>\n<hr>\n<ul>\n" > "$SITE_DIR/index.html"

          for OS in ubuntu-latest windows-latest; do
            if [ -d "$SITE_DIR/latest/$OS" ]; then
              TS_UTC=$(cat "$SITE_DIR/latest/$OS/build-info.txt" 2>/dev/null || echo "")
              TS_DISPLAY=$(TZ='America/Los_Angeles' date -d "$TS_UTC" '+%a %b %d %H:%M:%S PDT %Y' 2>/dev/null || echo "$TS_UTC")
              echo "<li><strong><a href='latest/$OS/${REPORT_NAME}'>Latest Report ($OS)</a></strong> - Last run: $TS_DISPLAY</li>" >> "$SITE_DIR/index.html"
            else
              echo "<li><strong>$OS:</strong> (No report found)</li>" >> "$SITE_DIR/index.html"
            fi
          done

          echo "</ul>" >> "$SITE_DIR/index.html"
          echo "<hr>" >> "$SITE_DIR/index.html"
          echo "<h2>📊 Report History & Trends (Times in PDT)</h2>" >> "$SITE_DIR/index.html"
          echo "<ul>" >> "$SITE_DIR/index.html"
          
          BUILDS=$(find "$SITE_DIR" -mindepth 1 -maxdepth 1 -type d -printf "%f\n" | grep -E '^[0-9]+$' | sort -nr)
          
          CHART_BUILDS=$(echo "$BUILDS" | sort -n)
          LABELS=""
          PASS_COUNTS=""
          FAIL_COUNTS=""

          for BUILD in $BUILDS; do
            # Use Ubuntu's info for the build timestamp
            TS_UTC=$(cat "$SITE_DIR/$BUILD/ubuntu-latest/build-info.txt" 2>/dev/null || echo "")
            TS_DISPLAY=$(TZ='America/Los_Angeles' date -d "$TS_UTC" '+%a %b %d %H:%M:%S PDT %Y' 2>/dev/null || echo "N/A")
            echo "<li><strong>Build #${BUILD}</strong> (Run: $TS_DISPLAY) - <a href='${BUILD}/ubuntu-latest/${REPORT_NAME}'>Ubuntu</a> / <a href='${BUILD}/windows-latest/${REPORT_NAME}'>Windows</a></li>" >> "$SITE_DIR/index.html"
          done

          echo "</ul>" >> "$SITE_DIR/index.html"

          # --- Chart Data Generation (Parsing stats.txt) ---
          for BUILD in $CHART_BUILDS; do
            TOTAL_PASS=0
            TOTAL_FAIL=0
            
            for OS in ubuntu-latest windows-latest; do
              # SOURCE_DIR is now specific to the OS inside current-reports
              STATS_FILE="$SITE_DIR/$BUILD/$OS/stats.txt"
              if [ -f "$STATS_FILE" ]; then
                # Example stats.txt content (after sed): 3 passed, 1 failed, 0 skipped, 0 untested, 0 broken
                # Extracting passed features/scenarios (first number)
                PASS=$(grep -oE '^[0-9]+ passed' "$STATS_FILE" | awk '{print $1}' || echo 0)
                # Extracting failed features/scenarios
                FAIL=$(grep -oE '[0-9]+ failed' "$STATS_FILE" | awk '{print $1}' || echo 0)
                
                TOTAL_PASS=$((TOTAL_PASS + PASS))
                TOTAL_FAIL=$((TOTAL_FAIL + FAIL))
              fi
            done

            LABELS="$LABELS'$BUILD',"
            PASS_COUNTS="$PASS_COUNTS$TOTAL_PASS,"
            FAIL_COUNTS="$FAIL_COUNTS$TOTAL_FAIL,"
          done
          
          # --- Final Chart JS injection using printf (No Here Document) ---
          # Clean the trailing commas from the lists.
          LABELS_CLEAN=${LABELS%,}
          PASS_CLEAN=${PASS_COUNTS%,}
          FAIL_CLEAN=${FAIL_COUNTS%,}
          
          printf "<div id='chart-container'><canvas id='trendChart'></canvas></div>\n<script>\nconst ctx = document.getElementById('trendChart').getContext('2d');\nnew Chart(ctx, {\n  type: 'line',\n  data: {\n    labels: [%s],\n    datasets: [\n      {label: 'PASS (Features/Scenarios)', data: [%s], borderColor: 'green', backgroundColor: 'rgba(0, 128, 0, 0.1)', fill: false, tension: 0.2},\n      {label: 'FAIL (Features/Scenarios)', data: [%s], borderColor: 'red', backgroundColor: 'rgba(255, 0, 0, 0.1)', fill: false, tension: 0.2}\n    ]\n  },\n  options: {responsive:true, maintainAspectRatio:false,\n    plugins:{legend:{position:'top'}},\n    scales:{\n      y:{beginAtZero:true, title:{display:true, text:'Total Features/Scenarios'}},\n      x:{title:{display:true, text:'Build Number'}}\n    }\n  }\n});\n</script>\n<hr><p><em>Generated on %s</em></p></body></html>\n" \
            "${LABELS_CLEAN}" "${PASS_CLEAN}" "${FAIL_CLEAN}" "${CURRENT_LA_TIME}" >> "$SITE_DIR/index.html"
