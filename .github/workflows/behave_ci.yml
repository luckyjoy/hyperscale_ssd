name: Hyperscale SSD Framework CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  SITE_DIR: site
  TIMEZONE: America/Los_Angeles

jobs:
  test:
    name: Run Behave Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    outputs:
      test_outcome: ${{ steps.run_behave_tests.outputs.test_outcome }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install behave-html-pretty-formatter pytz

      - name: Run Behave Tests
        id: run_behave_tests
        shell: bash
        run: |
          set +e
          OS_NAME=${{ matrix.os }}
          BUILD_NUMBER=${{ github.run_number }}
          REPORT_DIR="reports/$BUILD_NUMBER/$OS_NAME"
          REPORT_PATH="$REPORT_DIR/validation_report.html"
          STATS_FILE="$REPORT_DIR/stats.txt"

          mkdir -p "$REPORT_DIR"

          echo "🔍 Running tests on $OS_NAME..."
          behave --tags=@adv --exclude "features/manual_tests" \
            --format behave_html_pretty_formatter:PrettyHTMLFormatter \
            -o "$REPORT_PATH" --no-capture | tee /tmp/behave_output.txt

          TEST_EXIT_CODE=$?

          grep 'Features:' /tmp/behave_output.txt | sed 's/Features: //' > "$STATS_FILE"

          if [ $TEST_EXIT_CODE -ne 0 ]; then
            if grep -q "failed" /tmp/behave_output.txt; then
                RESULT=UNSTABLE
            else
                RESULT=FAIL
            fi
          else
            RESULT=PASS
          fi
          echo "test_outcome=$RESULT" >> $GITHUB_OUTPUT
          exit 0

      - name: Create PDT Timestamp
        shell: bash
        run: |
          python - <<'PYCODE'
          import datetime, pytz
          tz = pytz.timezone("America/Los_Angeles")
          now_pdt = datetime.datetime.now(tz).strftime("%Y-%m-%d %H:%M:%S %Z")
          print(now_pdt, file=open("timestamp_pdt.txt", "w"))
          PYCODE

      - uses: actions/upload-artifact@v4
        with:
          name: timestamp-${{ matrix.os }}
          path: timestamp_pdt.txt

      - uses: actions/upload-artifact@v4
        with:
          name: validation-report-${{ matrix.os }}
          path: reports/${{ github.run_number }}/${{ matrix.os }}

  build_summary:
    name: Generate History + Trend + Deploy
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install tools
        run: |
          python -m pip install jinja2 matplotlib pytz

      - name: Setup site directories
        run: mkdir -p ${{ env.SITE_DIR }}/latest

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize reports
        run: |
          for os in ubuntu-latest windows-latest; do
            mkdir -p "${{ env.SITE_DIR }}/latest/$os"
            if [ -d "artifacts/validation-report-$os" ]; then
              cp -r artifacts/validation-report-$os/* "${{ env.SITE_DIR }}/latest/$os/"
            fi
          done
          cp artifacts/timestamp-*/*.txt "${{ env.SITE_DIR }}/latest/" || true

      - name: Generate History and Trend Page
        run: |
          mkdir -p ${{ env.SITE_DIR }}
          HISTORY_FILE="${{ env.SITE_DIR }}/history.json"

          python - <<'PYCODE'
          import json, os, datetime, pytz, matplotlib.pyplot as plt
          from jinja2 import Template

          site_dir = os.environ["SITE_DIR"]
          history_file = os.path.join(site_dir, "history.json")
          tz = pytz.timezone("America/Los_Angeles")
          now_pdt = datetime.datetime.now(tz).strftime("%Y-%m-%d %H:%M:%S %Z")

          new_entry = {
              "build": int(os.getenv("GITHUB_RUN_NUMBER", "0")),
              "result": os.getenv("RESULT", "UNKNOWN"),
              "timestamp": now_pdt,
          }

          if os.path.exists(history_file):
              data = json.load(open(history_file))
          else:
              data = []
          data.append(new_entry)
          with open(history_file, "w") as f:
              json.dump(data, f, indent=2)

          # Build trend data
          results = [d["result"] for d in data]
          total = len(results)
          pass_count = results.count("PASS")
          fail_count = results.count("FAIL")
          unstable_count = results.count("UNSTABLE")

          plt.figure(figsize=(6,4))
          plt.bar(["PASS","FAIL","UNSTABLE"], [pass_count, fail_count, unstable_count])
          plt.title(f"Build Trend (Total {total})")
          plt.ylabel("Count")
          plt.tight_layout()
          plt.savefig(os.path.join(site_dir, "trend_chart.svg"), format="svg")

          # Generate HTML history page
          template = Template("""
          <html><head><title>Hyperscale SSD Build History</title></head><body>
          <h2>🤖 Hyperscale SSD Framework CI/CD Build History</h2>
          <p><b>Last updated:</b> {{ now_pdt }}</p>
          <table border="1" cellpadding="5" cellspacing="0">
          <tr><th>Build #</th><th>Result</th><th>Timestamp</th></tr>
          {% for e in history %}
            <tr><td>{{e.build}}</td><td>{{e.result}}</td><td>{{e.timestamp}}</td></tr>
          {% endfor %}
          </table>
          <h3>📊 Trend Chart</h3>
          <img src="trend_chart.svg" width="600"/>
          </body></html>
          """)
          with open(os.path.join(site_dir, "history.html"), "w") as f:
              f.write(template.render(history=data, now_pdt=now_pdt))
          PYCODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Workflow summary with badges
        if: always()
        run: |
          PAGE_URL="${{ steps.deployment.outputs.page_url }}"
          echo "### 💾 Hyperscale SSD Framework CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🕒 PDT Time:** $(cat ${{ env.SITE_DIR }}/latest/timestamp_pdt.txt 2>/dev/null || echo 'Unavailable')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🧩 **Latest Reports**" >> $GITHUB_STEP_SUMMARY
          for os in ubuntu-latest windows-latest; do
            if [ -f "${{ env.SITE_DIR }}/latest/$os/validation_report.html" ]; then
              echo "- $os: [View Report](${PAGE_URL}/latest/$os/validation_report.html)" >> $GITHUB_STEP_SUMMARY
            else
              echo "- $os: (No report found)" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📜 **Build History** ([Open History Page](${PAGE_URL}/history.html))" >> $GITHUB_STEP_SUMMARY
          jq -r '.[] | "- Build #\(.build) (\(.result)) — \(.timestamp)"' ${{ env.SITE_DIR }}/history.json >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 **Trend Chart**" >> $GITHUB_STEP_SUMMARY
          echo "<img src='${PAGE_URL}/trend_chart.svg' width='600'/>" >> $GITHUB_STEP_SUMMARY
