name: Hyperscale SSD Framework CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  SITE_DIR: site
  TIMEZONE: America/Los_Angeles  # PDT timezone

jobs:
  test:
    name: Run Behave Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    outputs:
      test_outcome: ${{ steps.run_behave_tests.outputs.test_outcome }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install behave-html-pretty-formatter pytz

      - name: Run Behave Tests
        id: run_behave_tests
        shell: bash
        run: |
          set +e
          OS_NAME=${{ matrix.os }}
          BUILD_NUMBER=${{ github.run_number }}
          REPORT_DIR="reports/$BUILD_NUMBER/$OS_NAME"
          REPORT_PATH="$REPORT_DIR/validation_report.html"
          STATS_FILE="$REPORT_DIR/stats.txt"

          mkdir -p "$REPORT_DIR"

          echo "🔍 Running tests on $OS_NAME..."
          behave --tags=@adv --exclude "features/manual_tests" \
            --format behave_html_pretty_formatter:PrettyHTMLFormatter \
            -o "$REPORT_PATH" --no-capture | tee /tmp/behave_output.txt

          TEST_EXIT_CODE=$?

          grep 'Features:' /tmp/behave_output.txt | sed 's/Features: //' > "$STATS_FILE"

          if [ $TEST_EXIT_CODE -ne 0 ]; then
            if grep -q "failed" /tmp/behave_output.txt; then
                RESULT=UNSTABLE
            else
                RESULT=FAIL
            fi
          else
            RESULT=PASS
          fi
          echo "test_outcome=$RESULT" >> $GITHUB_OUTPUT
          exit 0

      - name: Create PDT Timestamp
        shell: bash
        run: |
          python - <<'PYCODE'
          import datetime, pytz
          tz = pytz.timezone("America/Los_Angeles")
          now_pdt = datetime.datetime.now(tz).strftime("%Y-%m-%d %H:%M:%S %Z")
          print(now_pdt, file=open("timestamp_pdt.txt", "w"))
          PYCODE

      - uses: actions/upload-artifact@v4
        with:
          name: timestamp-${{ matrix.os }}
          path: timestamp_pdt.txt

      - uses: actions/upload-artifact@v4
        with:
          name: validation-report-${{ matrix.os }}
          path: reports/${{ github.run_number }}/${{ matrix.os }}

  build_summary:
    name: Generate CI Summary and Deploy
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup report directory
        run: mkdir -p ${{ env.SITE_DIR }}/latest

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize reports
        run: |
          mkdir -p ${{ env.SITE_DIR }}/latest
          for os in ubuntu-latest windows-latest; do
            if [ -d "artifacts/validation-report-$os" ]; then
              mkdir -p "${{ env.SITE_DIR }}/latest/$os"
              cp -r artifacts/validation-report-$os/* "${{ env.SITE_DIR }}/latest/$os/"
            fi
          done
          cp -r artifacts/timestamp-* "${{ env.SITE_DIR }}/latest/" || true

      - name: Generate Build History and Trend
        id: trend
        run: |
          HISTORY_FILE="${{ env.SITE_DIR }}/history.json"
          mkdir -p $(dirname "$HISTORY_FILE")

          echo "Updating build history..."
          NEW_ENTRY="{\"build\":${{ github.run_number }},\"result\":\"${{ needs.test.outputs.test_outcome }}\",\"timestamp\":\"$(cat artifacts/timestamp-ubuntu-latest/timestamp_pdt.txt 2>/dev/null || echo 'unknown')\"}"

          if [ -f "$HISTORY_FILE" ]; then
            jq ". + [$NEW_ENTRY]" "$HISTORY_FILE" > tmp.$$.json && mv tmp.$$.json "$HISTORY_FILE"
          else
            echo "[$NEW_ENTRY]" > "$HISTORY_FILE"
          fi

          echo "history_json=$(cat "$HISTORY_FILE" | jq -c .)" >> $GITHUB_OUTPUT

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Workflow summary with badges and trend
        if: always()
        run: |
          PAGE_URL="${{ steps.deployment.outputs.page_url }}"
          echo "### 💾 Hyperscale SSD Framework CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🕒 PDT Time:** $(cat artifacts/timestamp-ubuntu-latest/timestamp_pdt.txt 2>/dev/null || echo 'Not Available')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🤖 **Build #${{ github.run_number }} Result:** ${{ needs.test.outputs.test_outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🧩 **Latest Reports**" >> $GITHUB_STEP_SUMMARY
          for os in ubuntu-latest windows-latest; do
            if [ -f "${{ env.SITE_DIR }}/latest/$os/validation_report.html" ]; then
              echo "- $os: [View Report](${PAGE_URL}/latest/$os/validation_report.html)" >> $GITHUB_STEP_SUMMARY
            else
              echo "- $os: (No report found)" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📜 **Build History**" >> $GITHUB_STEP_SUMMARY
          jq -r '.[] | "- Build #\(.build) (\(.result)) — \(.timestamp)"' ${{ env.SITE_DIR }}/history.json >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 **Trend Chart (Pass/Fail/Unstable Ratios)**" >> $GITHUB_STEP_SUMMARY
          echo "<img src='${PAGE_URL}/trend_chart.svg' alt='Trend Chart' width='600'/>" >> $GITHUB_STEP_SUMMARY
