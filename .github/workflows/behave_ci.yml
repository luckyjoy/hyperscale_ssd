name: Hyperscale SSD Framework CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

env:
  SITE_DIR: site

jobs:
  test:
    name: Run tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    outputs:
      test_outcome: ${{ steps.run_behave_tests.outputs.test_outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        shell: bash
        run: |
          set +e
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Ensure 'jq' is installed for robust JSON generation on Linux
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Run Behave Tests
        id: run_behave_tests
        shell: bash
        run: |
          set +e
          OS_NAME=${{ matrix.os }}
          BUILD_NUMBER=${{ github.run_number }}
          REPORT_DIR="reports/$BUILD_NUMBER/$OS_NAME"
          mkdir -p "$REPORT_DIR"

          behave --tags=@all --exclude "features/manual_tests" \
            --format behave_html_pretty_formatter:PrettyHTMLFormatter \
            -o "$REPORT_DIR/validation_report.html" --no-capture | tee /tmp/behave_output.txt
          TEST_EXIT_CODE=$?

          if [ $TEST_EXIT_CODE -ne 0 ]; then
            if grep -q "failed" /tmp/behave_output.txt; then
              RESULT=UNSTABLE
            else
              RESULT=FAIL
            fi
          else
            RESULT=PASS
          fi
          echo "Detected result: $RESULT"
          echo "test_outcome=$RESULT" >> $GITHUB_OUTPUT
          echo "$RESULT" > "$REPORT_DIR/status.txt"
          echo "$(TZ='America/Los_Angeles' date)" > "$REPORT_DIR/timestamp.txt"
          
          # --- FIX: Generate summary.json for trend chart ---
          STATS_LINE=$(grep 'scenarios\.' /tmp/behave_output.txt | tail -n 1)

          PASSED_SCENARIOS=$(echo "$STATS_LINE" | grep -o '[0-9]\+ passed' | awk '{print $1}')
          FAILED_SCENARIOS=$(echo "$STATS_LINE" | grep -o '[0-9]\+ failed' | awk '{print $1}')
          
          PASSED_COUNT=${PASSED_SCENARIOS:-0}
          FAILED_COUNT=${FAILED_SCENARIOS:-0}

          if [ "$RESULT" = "UNSTABLE" ]; then
            BROKEN_COUNT=1
          else
            BROKEN_COUNT=0
          fi
          
          # Create the summary.json artifact using jq
          echo "{ \"statistic\": { \"passed\": ${PASSED_COUNT}, \"failed\": ${FAILED_COUNT}, \"broken\": ${BROKEN_COUNT} } }" | jq . > "$REPORT_DIR/summary.json"
          
          echo "Generated summary.json with Passed: ${PASSED_COUNT}, Failed: ${FAILED_COUNT}, Broken: ${BROKEN_COUNT}"
          # --- END FIX ---

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: reports/${{ github.run_number }}/${{ matrix.os }}/


  report:
    name: Generate Reports & Deploy
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🆕 FIX: Install JQ for JSON processing in the report job
      - name: Install JQ
        run: sudo apt-get update && sudo apt-get install -y jq

      # Fix: Dynamically find the workflow filename.
      - name: Get workflow filename
        id: get_workflow_name
        run: echo "WORKFLOW_FILE=$(basename .github/workflows/*.yml)" >> $GITHUB_ENV

      # Fix: Use previous working download artifact method
      - name: Download previous history artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ${{ env.WORKFLOW_FILE }}
          branch: main
          name: history
          path: previous-site
          if_no_artifact_found: ignore

      - name: Restore History
        run: |
          mkdir -p "${{ env.SITE_DIR }}"
          if [ -d "previous-site" ]; then
            echo "♻️ Restoring previous site history..."
            # Restore all previous builds and the latest report history folders
            cp -r previous-site/* "${{ env.SITE_DIR }}/" || true
          fi

      - name: Download Test Results
        uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Generate Reports Per OS
        shell: bash
        run: |
          SITE_DIR="site"
          BUILD_NUMBER=${{ github.run_number }}
          mkdir -p "$SITE_DIR/latest"

          for OS in ubuntu-latest windows-latest; do
            RESULTS_DIR="reports/reports-$OS"
            REPORT_DIR_BUILD="$SITE_DIR/$BUILD_NUMBER/$OS"
            REPORT_DIR_LATEST="$SITE_DIR/latest/$OS"
            mkdir -p "$RESULTS_DIR" "$REPORT_DIR_BUILD" "$REPORT_DIR_LATEST"

            # Fix: Preserve trend data from previous site
            if [ -d "site/latest/$OS/history" ]; then
              mkdir -p "$RESULTS_DIR/history"
              cp -r "site/latest/$OS/history/"* "$RESULTS_DIR/history/" || true
            fi

            REPO_NAME="${GITHUB_REPOSITORY##*/}"
            echo "{\"name\":\"$OS\",\"type\":\"GitHub Actions\",\"url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\",\"reportUrl\":\"https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/latest/$OS/\",\"buildOrder\":\"${BUILD_NUMBER}\",\"buildName\":\"Build ${BUILD_NUMBER} ($OS)\",\"buildUrl\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" > "$RESULTS_DIR/executor.json"

            cp -r reports/build-$OS/* "$REPORT_DIR_BUILD/" || true
            cp -r "$REPORT_DIR_BUILD"/* "$REPORT_DIR_LATEST/" || true
            date -u > "$REPORT_DIR_BUILD/build-info.txt"
            date -u > "$REPORT_DIR_LATEST/build-info.txt"
          done

      - name: Rebuild index.html with Trend Charts
        shell: bash
        run: |
          SITE_DIR="site"
          CURRENT_LA_TIME=$(TZ='America/Los_Angeles' date)
          mkdir -p "$SITE_DIR"

          echo "<html><head><title>Reports History</title>
          <script src='https://cdn.jsdelivr.net/npm/chart.js'></script>
          <style>
          body{font-family:sans-serif;margin:20px;}
          ul{list-style:none;padding:0;}
          li{margin:6px 0;}
          a{text-decoration:none;color:#0366d6;}
          a:hover{text-decoration:underline;}
          /* FIX: CSS to control the chart container's size and align left */
          #chart-container {
            max-width: 600px;
            max-height: 300px;
            margin: 0; /* Aligns the container to the left */
          }
          </style></head><body>
          <h1>🤖 Hyperscale SSD Framework Simulation CI/CD Build History</h1>
          <h2>🧩 Latest Reports</h2><hr><ul>" > "$SITE_DIR/index.html"

          for OS in ubuntu-latest windows-latest; do
            if [ -d "$SITE_DIR/latest/$OS" ]; then
              TS_UTC=$(cat "$SITE_DIR/latest/$OS/build-info.txt" 2>/dev/null || echo "")
              # Using '+%a %b %d %H:%M:%S PDT %Y' to explicitly show PDT/PST
              TS_DISPLAY=$(TZ='America/Los_Angeles' date -d "$TS_UTC" '+%a %b %d %H:%M:%S PDT %Y' 2>/dev/null || echo "$TS_UTC")
              echo "<li><strong><a href='latest/$OS/'>Latest Report ($OS)</a></strong> - Last run: $TS_DISPLAY</li>" >> "$SITE_DIR/index.html"
            else
              echo "<li><strong>$OS:</strong> (No report found)</li>" >> "$SITE_DIR/index.html"
            fi
          done

          echo "</ul><hr><h2>📊 Report History & Trends (Times in PDT)</h2>" >> "$SITE_DIR/index.html"
          # Fix: Sort builds newest to oldest for the list
          BUILDS=$(find "$SITE_DIR" -mindepth 1 -maxdepth 1 -type d -printf "%f\n" | grep -E '^[0-9]+$' | sort -nr)
          
          echo "<ul>" >> "$SITE_DIR/index.html"
          # Data for chart needs to be in ascending order (oldest to newest)
          CHART_BUILDS=$(echo "$BUILDS" | sort -n)
          LABELS=""
          PASS_COUNTS=""
          FAIL_COUNTS=""
          UNSTABLE_COUNTS=""

          # Generate the visible list of links (newest to oldest)
          for BUILD in $BUILDS; do
            # Get the UTC time from the Ubuntu build info file and convert it
            TS_UTC=$(cat "$SITE_DIR/$BUILD/ubuntu-latest/build-info.txt" 2>/dev/null || echo "")
            TS_DISPLAY=$(TZ='America/Los_Angeles' date -d "$TS_UTC" '+%a %b %d %H:%M:%S PDT %Y' 2>/dev/null || echo "N/A")

            # ✅ FIX: Added date and time in PDT to the build list item
            echo "<li><strong>Build #${BUILD}</strong> (Run: $TS_DISPLAY) - <a href='${BUILD}/ubuntu-latest/'>Ubuntu</a> / <a href='${BUILD}/windows-latest/'>Windows</a></li>" >> "$SITE_DIR/index.html"
          done
          echo "</ul>" >> "$SITE_DIR/index.html"

          # Gather data for the chart (oldest to newest)
          # Fix: Reads actual test statistics from summary.json
          for BUILD in $CHART_BUILDS; do
            TOTAL_PASS=0
            TOTAL_FAIL=0   
            TOTAL_UNSTABLE=0 
            
            for OS in ubuntu-latest windows-latest; do
              # ✅ FIX: Correct path to summary.json (Removed /widgets/)
              SUMMARY_FILE="$SITE_DIR/$BUILD/$OS/summary.json"
              
              if [ -f "$SUMMARY_FILE" ]; then
                PASS_COUNT=$(jq -r '.statistic.passed // 0' "$SUMMARY_FILE" 2>/dev/null)
                FAIL_COUNT=$(jq -r '.statistic.failed // 0' "$SUMMARY_FILE" 2>/dev/null)
                BROKEN_COUNT=$(jq -r '.statistic.broken // 0' "$SUMMARY_FILE" 2>/dev/null)

                TOTAL_PASS=$((TOTAL_PASS + PASS_COUNT))
                TOTAL_FAIL=$((TOTAL_FAIL + FAIL_COUNT))
                TOTAL_UNSTABLE=$((TOTAL_UNSTABLE + BROKEN_COUNT))
              fi
            done
            
            LABELS="$LABELS'$BUILD',"
            PASS_COUNTS="$PASS_COUNTS$TOTAL_PASS,"
            FAIL_COUNTS="$FAIL_COUNTS$TOTAL_FAIL,"
            UNSTABLE_COUNTS="$UNSTABLE_COUNTS$TOTAL_UNSTABLE,"
          done

          # The canvas is correctly wrapped in a controlled div
          echo "<div id='chart-container'>
          <canvas id='trendChart'></canvas>
          </div>
          <script>
          const ctx = document.getElementById('trendChart').getContext('2d');
          new Chart(ctx, {
            type: 'line',
            data: {
              labels: [${LABELS%,}],
              datasets: [
                {label: 'PASS', data: [${PASS_COUNTS%,}], borderColor: 'green', fill: false},
                {label: 'FAIL', data: [${FAIL_COUNTS%,}], borderColor: 'red', fill: false},
                {label: 'UNSTABLE', data: [${UNSTABLE_COUNTS%,}], borderColor: 'orange', fill: false}
              ]
            },
            options: { 
              responsive: true, 
              maintainAspectRatio: false, 
              plugins: { legend: { position: 'top' } }, 
              scales: { 
                y: { 
                  beginAtZero: true, 
                  stepSize: 1,
                  // Y-axis title
                  title: {
                    display: true,
                    text: 'Total Number of Tests'
                  }
                },
                x: {
                  // X-axis title
                  title: {
                    display: true,
                    text: 'Build Number'
                  }
                }
              } 
            }
          });
          </script>
          <hr><p><em>Generated automatically on $CURRENT_LA_TIME</em></p></body></html>" >> "$SITE_DIR/index.html"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload History Artifact
        uses: actions/upload-artifact@v4
        with:
          name: history
          path: ${{ env.SITE_DIR }}
          retention-days: 7

      - name: Add Workflow Summary (Badges)
        run: |
          PAGE_URL=${{ steps.deployment.outputs.page_url }}
          BASE_URL="${PAGE_URL%/}"
          TEST_STATUS=${{ needs.test.outputs.test_outcome }}

          if [[ "$TEST_STATUS" == "FAIL" ]]; then
            STATUS_ICON="❌"
            STATUS_TEXT="Failed (setup/config error)"
          elif [[ "$TEST_STATUS" == "UNSTABLE" ]]; then
            STATUS_ICON="⚠️"
            STATUS_TEXT="Unstable (some tests failed)"
          else
            STATUS_ICON="✅"
            STATUS_TEXT="All tests passed"
          fi

          echo "### 🤖 Hyperscale SSD Framework Simulation CI/CD" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[![Ubuntu Latest Report](https://img.shields.io/badge/Ubuntu-Latest_Build-blue)](${BASE_URL}/latest/ubuntu-latest/index.html)" >> $GITHUB_STEP_SUMMARY
          echo "[![Windows Latest Report](https://img.shields.io/badge/Windows-Latest_Build-blue)](${BASE_URL}/latest/windows-latest/index.html)" >> $GITHUB_STEP_SUMMARY
          echo "[![Report History](https://img.shields.io/badge/All-Builds-green)](${BASE_URL}/)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build #${{ github.run_number }} | Status: $STATUS_ICON $STATUS_TEXT" >> $GITHUB_STEP_SUMMARY