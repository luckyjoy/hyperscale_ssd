name: Hyperscale SSD Framework CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  SITE_DIR: site
  TIMEZONE: America/Los_Angeles

jobs:
  test:
    name: Run Behave Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    outputs:
      test_outcome: ${{ steps.run_behave_tests.outputs.test_outcome }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install behave-html-pretty-formatter pytz

      - name: Run Behave Tests
        id: run_behave_tests
        shell: bash
        run: |
          set +e
          OS_NAME=${{ matrix.os }}
          BUILD_NUMBER=${{ github.run_number }}
          REPORT_DIR="reports/$BUILD_NUMBER/$OS_NAME"
          REPORT_PATH="$REPORT_DIR/validation_report.html"
          STATS_FILE="$REPORT_DIR/stats.txt"

          mkdir -p "$REPORT_DIR"

          echo "🔍 Running tests on $OS_NAME..."
          behave --tags=@adv --exclude "features/manual_tests" \
            --format behave_html_pretty_formatter:PrettyHTMLFormatter \
            -o "$REPORT_PATH" --no-capture | tee /tmp/behave_output.txt

          TEST_EXIT_CODE=$?

          grep 'Features:' /tmp/behave_output.txt | sed 's/Features: //' > "$STATS_FILE"

          if [ $TEST_EXIT_CODE -ne 0 ]; then
            if grep -q "failed" /tmp/behave_output.txt; then
                RESULT=UNSTABLE
            else
                RESULT=FAIL
            fi
          else
            RESULT=PASS
          fi
          echo "test_outcome=$RESULT" >> $GITHUB_OUTPUT
          exit 0

      - name: Create PDT Timestamp
        shell: bash
        run: |
          python - <<'PYCODE'
          import datetime, pytz
          tz = pytz.timezone("America/Los_Angeles")
          now_pdt = datetime.datetime.now(tz).strftime("%Y-%m-%d %H:%M:%S %Z")
          print(now_pdt, file=open("timestamp_pdt.txt", "w"))
          PYCODE

      - uses: actions/upload-artifact@v4
        with:
          name: timestamp-${{ matrix.os }}
          path: timestamp_pdt.txt

      - uses: actions/upload-artifact@v4
        with:
          name: validation-report-${{ matrix.os }}
          path: reports/${{ github.run_number }}/${{ matrix.os }}

  report:
    name: Generate History + Trend + Deploy
    needs: [test]
    runs-on: ubuntu-latest
    env:
      SITE_DIR: site
      TIMEZONE: America/Los_Angeles
      RESULT: ${{ needs.test.outputs.test_outcome }}   # ✅ FIX: Propagate test result to env

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install tools
        run: |
          python -m pip install jinja2 matplotlib pytz

      - name: Setup site directories
        run: mkdir -p $SITE_DIR/latest

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize reports
        run: |
          for os in ubuntu-latest windows-latest; do
            mkdir -p "$SITE_DIR/latest/$os"
            if [ -d "artifacts/validation-report-$os" ]; then
              cp -r artifacts/validation-report-$os/* "$SITE_DIR/latest/$os/"
            fi
          done
          cp artifacts/timestamp-*/*.txt "$SITE_DIR/latest/" || true

      - name: Generate and update build history
        if: always()
        run: |
          mkdir -p history
          HISTORY_FILE=history/history.json
          BUILD_DIR="latest"

          # Get current time in PDT
          TIMESTAMP=$(TZ='America/Los_Angeles' date +"%Y-%m-%d %H:%M:%S PDT")

          # Determine status
          STATUS="${{ job.status }}"
          if [[ "$STATUS" == "success" ]]; then
            RESULT="PASS"
          elif [[ "$STATUS" == "failure" ]]; then
            RESULT="FAIL"
          else
            RESULT="UNSTABLE"
          fi

          # Append to history.json
          echo "Updating build history..."
          jq --arg bn "${{ github.run_number }}" \
             --arg ts "$TIMESTAMP" \
             --arg st "$RESULT" \
             --arg ul "${{ env.SITE_DIR }}/ubuntu-latest/validation_report.html" \
             --arg wl "${{ env.SITE_DIR }}/windows-latest/validation_report.html" \
             '. + [{"build":$bn, "timestamp":$ts, "status":$st, "ubuntu_link":$ul, "windows_link":$wl}]' \
             history.json 2>/dev/null | jq 'unique_by(.build) | sort_by(.build)' > history.tmp || \
             echo '[{"build":'${{ github.run_number }}',"timestamp":"'$TIMESTAMP'","status":"'$RESULT'"}]' > history.tmp

          mv history.tmp history.json

          # Create history.html
          python3 <<'EOF'
          import json, datetime, pytz
          from pathlib import Path

          data = json.load(open("history.json"))
          data.sort(key=lambda x: x["build"], reverse=True)
          latest = data[0]

          html = """
          <html>
          <head>
            <meta charset="UTF-8">
            <title>Hyperscale SSD Framework CI/CD History</title>
            <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
            <style>
              body { font-family: Arial, sans-serif; margin: 30px; background: #f5f7fa; }
              h1, h2 { color: #333; }
              table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
              th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; }
              .pass { color: green; }
              .fail { color: red; }
              .unstable { color: orange; }
            </style>
          </head>
          <body>
            <h1>🤖 Hyperscale SSD Framework CI/CD Build History</h1>
            <h2>🧩 Latest Reports</h2>
            <ul>
              <li>Ubuntu: <a href="{ul}">{ul}</a></li>
              <li>Windows: <a href="{wl}">{wl}</a></li>
            </ul>

            <h2>📜 Build History</h2>
            <table>
              <tr><th>Build</th><th>Timestamp (PDT)</th><th>Status</th></tr>
          """.format(ul=latest["ubuntu_link"], wl=latest["windows_link"])

          for entry in data:
              cls = entry["status"].lower()
              html += f'<tr><td><a href="{entry["ubuntu_link"]}">#{entry["build"]}</a></td><td>{entry["timestamp"]}</td><td class="{cls}">{entry["status"]}</td></tr>'

          # Trend chart data
          counts = {"PASS":0, "FAIL":0, "UNSTABLE":0}
          for e in data: counts[e["status"]] = counts.get(e["status"], 0)+1

          html += f"""
            </table>
            <h2>📊 Trend Chart</h2>
            <canvas id="trendChart" height="100"></canvas>
            <script>
              const ctx = document.getElementById('trendChart');
              new Chart(ctx, {{
                type: 'bar',
                data: {{
                  labels: ['PASS', 'FAIL', 'UNSTABLE'],
                  datasets: [{{
                    label: 'Build Outcome Ratios',
                    data: [{counts["PASS"]}, {counts["FAIL"]}, {counts["UNSTABLE"]}],
                    backgroundColor: ['#28a745', '#dc3545', '#ffc107']
                  }}]
                }},
                options: {{
                  scales: {{
                    y: {{ beginAtZero: true }}
                  }}
                }}
              }});
            </script>
          </body></html>
          """
          Path("history.html").write_text(html)
          EOF

          cp history.json history.html ${{ env.SITE_DIR }}/


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Workflow summary with badges
        if: always()
        run: |
          PAGE_URL="${{ steps.deployment.outputs.page_url }}"
          RESULT="${{ env.RESULT }}"
          echo "### 💾 Hyperscale SSD Framework CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build #${{ github.run_number }} Result:** $RESULT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[![Ubuntu Report](https://img.shields.io/badge/Ubuntu-Latest-blue)](${PAGE_URL}/latest/ubuntu-latest/validation_report.html)" >> $GITHUB_STEP_SUMMARY
          echo "[![Windows Report](https://img.shields.io/badge/Windows-Latest-blue)](${PAGE_URL}/latest/windows-latest/validation_report.html)" >> $GITHUB_STEP_SUMMARY
          echo "[![History](https://img.shields.io/badge/View-History-green)](${PAGE_URL}/history.html)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 **Trend Chart**" >> $GITHUB_STEP_SUMMARY
          echo "<img src='${PAGE_URL}/trend_chart.svg' width='600'/>" >> $GITHUB_STEP_SUMMARY
