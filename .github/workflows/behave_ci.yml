name: Hyperscale SSD Framework CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  SITE_DIR: site
  TIMEZONE: America/Los_Angeles

jobs:
  test:
    name: Run Behave Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    outputs:
      test_outcome: ${{ steps.run_behave_tests.outputs.test_outcome }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install behave-html-pretty-formatter pytz

      - name: Run Behave Tests
        id: run_behave_tests
        shell: bash
        run: |
          set +e
          OS_NAME=${{ matrix.os }}
          BUILD_NUMBER=${{ github.run_number }}
          REPORT_DIR="reports/$BUILD_NUMBER/$OS_NAME"
          REPORT_PATH="$REPORT_DIR/validation_report.html"
          STATS_FILE="$REPORT_DIR/stats.txt"

          mkdir -p "$REPORT_DIR"

          echo "🔍 Running tests on $OS_NAME..."
          behave --tags=@adv --exclude "features/manual_tests" \
            --format behave_html_pretty_formatter:PrettyHTMLFormatter \
            -o "$REPORT_PATH" --no-capture | tee /tmp/behave_output.txt

          TEST_EXIT_CODE=$?

          grep 'Features:' /tmp/behave_output.txt | sed 's/Features: //' > "$STATS_FILE"

          if [ $TEST_EXIT_CODE -ne 0 ]; then
            if grep -q "failed" /tmp/behave_output.txt; then
                RESULT=UNSTABLE
            else
                RESULT=FAIL
            fi
          else
            RESULT=PASS
          fi
          echo "test_outcome=$RESULT" >> $GITHUB_OUTPUT
          exit 0

      - name: Create PDT Timestamp
        shell: bash
        run: |
          python - <<'PYCODE'
          import datetime, pytz
          tz = pytz.timezone("America/Los_Angeles")
          now_pdt = datetime.datetime.now(tz).strftime("%Y-%m-%d %H:%M:%S %Z")
          print(now_pdt, file=open("timestamp_pdt.txt", "w"))
          PYCODE

      - uses: actions/upload-artifact@v4
        with:
          name: timestamp-${{ matrix.os }}
          path: timestamp_pdt.txt

      - uses: actions/upload-artifact@v4
        with:
          name: validation-report-${{ matrix.os }}
          path: reports/${{ github.run_number }}/${{ matrix.os }}

  report:
    name: Generate History + Trend + Deploy
    needs: [test]
    runs-on: ubuntu-latest
    env:
      SITE_DIR: site
      TIMEZONE: America/Los_Angeles
      RESULT: ${{ needs.test.outputs.test_outcome }}   # ✅ FIX: Propagate test result to env

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install tools
        run: |
          python -m pip install jinja2 matplotlib pytz

      - name: Setup site directories
        run: mkdir -p $SITE_DIR/latest

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize reports
        run: |
          for os in ubuntu-latest windows-latest; do
            mkdir -p "$SITE_DIR/latest/$os"
            if [ -d "artifacts/validation-report-$os" ]; then
              cp -r artifacts/validation-report-$os/* "$SITE_DIR/latest/$os/"
            fi
          done
          cp artifacts/timestamp-*/*.txt "$SITE_DIR/latest/" || true

      - name: Generate History and Trend Page
        run: |
          mkdir -p $SITE_DIR
          HISTORY_FILE="$SITE_DIR/history.json"

          python - <<'PYCODE'
          import json, os, datetime, pytz, matplotlib.pyplot as plt
          from jinja2 import Template

          site_dir = os.environ["SITE_DIR"]
          history_file = os.path.join(site_dir, "history.json")
          tz = pytz.timezone(os.environ.get("TIMEZONE", "America/Los_Angeles"))
          now_pdt = datetime.datetime.now(tz).strftime("%Y-%m-%d %H:%M:%S %Z")

          result = os.environ.get("RESULT", "UNKNOWN")
          build = int(os.getenv("GITHUB_RUN_NUMBER", "0"))

          # ✅ FIX: Skip adding UNKNOWN results if no tests were run
          if result == "UNKNOWN":
              print(f"⚠️  No test result found for Build #{build}, defaulting to FAIL.")
              result = "FAIL"

          new_entry = {
              "build": build,
              "result": result,
              "timestamp": now_pdt
          }

          # Keep previous history
          if os.path.exists(history_file):
              data = json.load(open(history_file))
              # Remove duplicates for same build
              data = [d for d in data if d["build"] != build]
          else:
              data = []

          data.append(new_entry)
          data.sort(key=lambda x: x["build"])

          with open(history_file, "w") as f:
              json.dump(data, f, indent=2)

          # Prepare trend counts
          pass_count = sum(1 for d in data if d["result"] == "PASS")
          fail_count = sum(1 for d in data if d["result"] == "FAIL")
          unstable_count = sum(1 for d in data if d["result"] == "UNSTABLE")

          plt.figure(figsize=(6,4))
          plt.bar(["PASS","FAIL","UNSTABLE"], [pass_count, fail_count, unstable_count],
                  color=["green","red","orange"])
          plt.title(f"Build Trend (Total {len(data)})")
          plt.ylabel("Count")
          plt.tight_layout()
          plt.savefig(os.path.join(site_dir, "trend_chart.svg"), format="svg")

          # Build HTML table
          template = Template("""
          <html><head><title>Hyperscale SSD Build History</title></head>
          <body style="font-family:sans-serif;margin:20px;">
          <h2>🤖 Hyperscale SSD Framework CI/CD Build History</h2>
          <p><b>Last updated:</b> {{ now_pdt }}</p>
          <h3>📜 Build History</h3>
          <table border="1" cellpadding="5" cellspacing="0">
            <tr><th>Build #</th><th>Result</th><th>Timestamp (PDT)</th></tr>
            {% for e in history %}
              <tr>
                <td>{{ e.build }}</td>
                <td style="color:{% if e.result=='PASS' %}green{% elif e.result=='UNSTABLE' %}orange{% else %}red{% endif %};font-weight:bold;">
                  {{ e.result }}
                </td>
                <td>{{ e.timestamp }}</td>
              </tr>
            {% endfor %}
          </table>
          <h3>📊 Trend Chart</h3>
          <img src="trend_chart.svg" width="600"/>
          <p><em>Generated automatically on {{ now_pdt }}</em></p>
          </body></html>
          """)
          with open(os.path.join(site_dir, "history.html"), "w") as f:
              f.write(template.render(history=data, now_pdt=now_pdt))
          PYCODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Workflow summary with badges
        if: always()
        run: |
          PAGE_URL="${{ steps.deployment.outputs.page_url }}"
          RESULT="${{ env.RESULT }}"
          echo "### 💾 Hyperscale SSD Framework CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build #${{ github.run_number }} Result:** $RESULT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[![Ubuntu Report](https://img.shields.io/badge/Ubuntu-Latest-blue)](${PAGE_URL}/latest/ubuntu-latest/validation_report.html)" >> $GITHUB_STEP_SUMMARY
          echo "[![Windows Report](https://img.shields.io/badge/Windows-Latest-blue)](${PAGE_URL}/latest/windows-latest/validation_report.html)" >> $GITHUB_STEP_SUMMARY
          echo "[![History](https://img.shields.io/badge/View-History-green)](${PAGE_URL}/history.html)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 **Trend Chart**" >> $GITHUB_STEP_SUMMARY
          echo "<img src='${PAGE_URL}/trend_chart.svg' width='600'/>" >> $GITHUB_STEP_SUMMARY
