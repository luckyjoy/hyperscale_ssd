name: Hyperscale SSD Framework CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  SITE_DIR: site

jobs:
  test:
    name: Run Behave Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          set +e
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [[ "${{ matrix.os }}" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y jq
          else
            choco install jq -y || true
          fi

      - name: Run Behave Tests
        run: |
          echo "Running Behave tests..."
          BUILD_NUMBER=${{ github.run_number }}
          OS_NAME=${{ matrix.os }}
          REPORT_DIR="reports/$BUILD_NUMBER/$OS_NAME"
          mkdir -p "$REPORT_DIR"

          behave --tags=@adv --exclude "features/manual_tests" \
            --format behave_html_pretty_formatter:PrettyHTMLFormatter \
            -o "$REPORT_DIR/report.html" --no-capture || true

          # Generate summary.json for this OS
          PASSED=$(grep -o "class=['\"]scenario passed['\"]" "$REPORT_DIR/report.html" | wc -l || echo 0)
          FAILED=$(grep -o "class=['\"]scenario failed['\"]" "$REPORT_DIR/report.html" | wc -l || echo 0)
          SKIPPED=$(grep -o "class=['\"]scenario skipped['\"]" "$REPORT_DIR/report.html" | wc -l || echo 0)

          jq -n --argjson p "$PASSED" --argjson f "$FAILED" --argjson s "$SKIPPED" \
            '{passed: $p, failed: $f, skipped: $s, timestamp: "'$(date -u +'%Y-%m-%dT%H:%M:%SZ')'"}' \
            > "$REPORT_DIR/summary.json"

          echo "✅ Report generated at $REPORT_DIR"
          echo "PASSED=$PASSED, FAILED=$FAILED, SKIPPED=$SKIPPED"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: behave-report-${{ matrix.os }}
          path: reports/${{ github.run_number }}/${{ matrix.os }}/

  generate-dashboard:
    name: Generate Reports & Deploy
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: behave-report-ubuntu-latest
          path: current/ubuntu-latest
      - uses: actions/download-artifact@v4
        with:
          name: behave-report-windows-latest
          path: current/windows-latest

      - name: Merge History and Append Current Build
        run: |
          echo "Merging build history..."
          mkdir -p ${{ env.SITE_DIR }}/history
          BUILD_ID=$(date -u +'%Y%m%d-%H%M%S')

          for OS in ubuntu-latest windows-latest; do
            mkdir -p ${{ env.SITE_DIR }}/history/$BUILD_ID/$OS
            cp -r current/$OS/* ${{ env.SITE_DIR }}/history/$BUILD_ID/$OS/
          done

          SUMMARY_JSON="${{ env.SITE_DIR }}/history/summary.json"
          [[ ! -f "$SUMMARY_JSON" ]] && echo "[]" > "$SUMMARY_JSON"

          # Merge summaries safely
          TMP_COMBINED=$(mktemp)
          jq -s '.[0] + .[1]' current/ubuntu-latest/summary.json current/windows-latest/summary.json > "$TMP_COMBINED"

          jq --slurpfile new "$TMP_COMBINED" '. + [{"build":"'"$BUILD_ID"'","data":$new[0]}]' "$SUMMARY_JSON" > ${{ env.SITE_DIR }}/history/tmp.json
          mv ${{ env.SITE_DIR }}/history/tmp.json "$SUMMARY_JSON"
          rm "$TMP_COMBINED"

          echo "✅ summary.json updated:"
          cat "$SUMMARY_JSON"

      - name: Build Dashboard with Trend Chart
        run: |
          echo "Building dashboard..."
          mkdir -p ${{ env.SITE_DIR }}
          SUMMARY_JSON="${{ env.SITE_DIR }}/history/summary.json"
          INDEX_HTML="${{ env.SITE_DIR }}/index.html"

          echo "<html><head><title>Hyperscale SSD Dashboard</title>
          <script src='https://cdn.jsdelivr.net/npm/chart.js'></script>
          <style>body{font-family:sans-serif;margin:20px;}table{border-collapse:collapse;}td,th{padding:6px;border:1px solid #ccc;}</style>
          </head><body>" > "$INDEX_HTML"

          echo "<h1>📊 Hyperscale SSD Framework CI/CD Build History</h1>" >> "$INDEX_HTML"

          # Table of builds
          echo "<h2>Builds</h2><table><tr><th>#</th><th>Build</th><th>Passed</th><th>Failed</th><th>Skipped</th><th>Ubuntu</th><th>Windows</th></tr>" >> "$INDEX_HTML"

          jq -r 'reverse | to_entries[] | "\(.key+1)|\(.value.build)|\(.value.data.passed)|\(.value.data.failed)|\(.value.data.skipped)"' "$SUMMARY_JSON" |
          while IFS="|" read -r idx build passed failed skipped; do
            echo "<tr><td>${idx}</td><td>${build}</td><td>${passed}</td><td>${failed}</td><td>${skipped}</td>" \
                 "<td><a href='history/${build}/ubuntu-latest/report.html'>View</a></td>" \
                 "<td><a href='history/${build}/windows-latest/report.html'>View</a></td></tr>" >> "$INDEX_HTML"
          done
          echo "</table>" >> "$INDEX_HTML"

          # Trend chart
          LABELS=$(jq -r '.[].build' "$SUMMARY_JSON" | paste -sd "," -)
          PASS_DATA=$(jq -r '.[].data.passed' "$SUMMARY_JSON" | paste -sd "," -)
          FAIL_DATA=$(jq -r '.[].data.failed' "$SUMMARY_JSON" | paste -sd "," -)
          SKIPPED_DATA=$(jq -r '.[].data.skipped' "$SUMMARY_JSON" | paste -sd "," -)

          echo "<h2>Trend Chart</h2><canvas id='trendChart' width='800' height='400'></canvas>
          <script>
          new Chart(document.getElementById('trendChart').getContext('2d'), {
            type: 'line',
            data: {
              labels: [$LABELS],
              datasets:[
                {label:'Passed', data:[$PASS_DATA], borderColor:'green', fill:false},
                {label:'Failed', data:[$FAIL_DATA], borderColor:'red', fill:false},
                {label:'Skipped', data:[$SKIPPED_DATA], borderColor:'orange', fill:false}
              ]
            },
            options:{responsive:true,plugins:{legend:{position:'top'}},scales:{y:{beginAtZero:true}}}
          });
          </script>" >> "$INDEX_HTML"

          echo "</body></html>" >> "$INDEX_HTML"
          echo "✅ Dashboard built at $INDEX_HTML"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.SITE_DIR }}
          publish_branch: gh-pages
