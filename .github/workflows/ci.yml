name: Hyperscale SSD Framework CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  SITE_DIR: site

jobs:
  test:
    name: Run Behave Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    outputs:
      test_outcome: ${{ steps.behave_tests.outputs.test_outcome }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install Dependencies
        shell: bash
        run: |
          set +e
          python -m pip install --upgrade pip
          pip install -r requirements.txt allure-behave jq
          if [[ "${{ matrix.os }}" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y jq
          else
            choco install jq -y || true
          fi

      - name: Run Behave with Allure
        id: behave_tests
        shell: bash
        continue-on-error: true
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          OS_NAME=${{ matrix.os }}
          REPORT_DIR="reports/$BUILD_NUMBER/$OS_NAME"
          mkdir -p "$REPORT_DIR/allure-results"

          echo ">>> Running Behave on $OS_NAME, build $BUILD_NUMBER"
          behave -f allure_behave.formatter:AllureFormatter -o "$REPORT_DIR/allure-results" || true

          # Extract test stats
          PASSED=$(grep -o 'status="passed"' "$REPORT_DIR/allure-results"/*.xml | wc -l || echo 0)
          FAILED=$(grep -o 'status="failed"' "$REPORT_DIR/allure-results"/*.xml | wc -l || echo 0)
          SKIPPED=$(grep -o 'status="skipped"' "$REPORT_DIR/allure-results"/*.xml | wc -l || echo 0)
          
          # Determine outcome
          if [[ $FAILED -gt 0 ]]; then
            OUTCOME=UNSTABLE
          else
            OUTCOME=PASS
          fi

          echo "PASSED=$PASSED" >> $GITHUB_ENV
          echo "FAILED=$FAILED" >> $GITHUB_ENV
          echo "SKIPPED=$SKIPPED" >> $GITHUB_ENV
          echo "OUTCOME=$OUTCOME" >> $GITHUB_ENV
          echo "test_outcome=$OUTCOME" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: reports/${{ github.run_number }}/${{ matrix.os }}/

  merge_history:
    name: Merge Allure History
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Previous History Artifact
        uses: actions/download-artifact@v4
        with:
          name: history
          path: previous-site

      - name: Download Current Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Merge History
        shell: bash
        run: |
          mkdir -p ${{ env.SITE_DIR }}
          HISTORY_FILE="${{ env.SITE_DIR }}/history.json"
          touch "$HISTORY_FILE"
          echo "[]" > "$HISTORY_FILE"

          # Merge previous history
          if [ -d "previous-site" ]; then
            for build in previous-site/*; do
              [ -d "$build" ] || continue
              cat "$build/summary.json" >> "$HISTORY_FILE"
            done
          fi

          # Merge current builds
          for OS in ubuntu-latest windows-latest; do
            BUILD_DIR="reports/${{ github.run_number }}/$OS"
            if [ -d "$BUILD_DIR/allure-results" ]; then
              SUMMARY="{\"build\":${{ github.run_number }},\"os\":\"$OS\",\"passed\":$PASSED,\"failed\":$FAILED,\"skipped\":$SKIPPED}"
              jq --slurpfile new <(echo "$SUMMARY") '. + $new' "$HISTORY_FILE" > tmp.json && mv tmp.json "$HISTORY_FILE"
            fi
          done

  deploy:
    name: Generate Dashboard & Deploy
    runs-on: ubuntu-latest
    needs: merge_history
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Rebuild Allure Reports
        shell: bash
        run: |
          SITE="${{ env.SITE_DIR }}"
          mkdir -p "$SITE/latest"

          for OS in ubuntu-latest windows-latest; do
            BUILD_DIR="reports/${{ github.run_number }}/$OS"
            if [ -d "$BUILD_DIR/allure-results" ]; then
              allure generate "$BUILD_DIR/allure-results" -o "$SITE/${{ github.run_number }}/$OS" --clean
              allure generate "$BUILD_DIR/allure-results" -o "$SITE/latest/$OS" --clean
            fi
          done

      - name: Build Dashboard HTML
        shell: bash
        run: |
          SITE="${{ env.SITE_DIR }}"
          HISTORY="$SITE/history.json"
          DASHBOARD="$SITE/index.html"

          PASSED=$(jq '[.[] | .passed] | add' $HISTORY)
          FAILED=$(jq '[.[] | .failed] | add' $HISTORY)
          SKIPPED=$(jq '[.[] | .skipped] | add' $HISTORY)

          cat > "$DASHBOARD" <<HTML
<html>
<head><title>Hyperscale SSD CI/CD Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>body{font-family:sans-serif;margin:20px;}ul{list-style:none;padding:0;}li{margin:6px 0;}a{text-decoration:none;color:#0366d6;}a:hover{text-decoration:underline;}#chart-container{max-width:800px;margin:0;}</style>
</head>
<body>
<h1>🤖 Hyperscale SSD Framework CI/CD Build History</h1>
<h2>🧩 Latest Reports</h2>
<ul>
  <li><a href="latest/ubuntu-latest/index.html">Ubuntu Latest</a></li>
  <li><a href="latest/windows-latest/index.html">Windows Latest</a></li>
</ul>
<h2>📊 Report History & Trends</h2>
<canvas id="trendChart"></canvas>
<script>
const history = $(jq -c '.' $HISTORY);
const labels = history.map(h => h.build);
const passed = history.map(h => h.passed);
const failed = history.map(h => h.failed);
const skipped = history.map(h => h.skipped);

const ctx = document.getElementById('trendChart').getContext('2d');
new Chart(ctx, {
  type: 'line',
  data: {
    labels: labels,
    datasets: [
      {label: 'Passed', data: passed, borderColor:'green', fill:false},
      {label: 'Failed', data: failed, borderColor:'red', fill:false},
      {label: 'Skipped', data: skipped, borderColor:'orange', fill:false}
    ]
  },
  options: {responsive:true, maintainAspectRatio:false}
});
</script>
</body></html>
HTML

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Add Workflow Summary (Badges)
        run: |
          PAGE_URL=${{ steps.deployment.outputs.page_url }}
          BASE_URL="${PAGE_URL%/}"
          TEST_STATUS=${{ needs.test.outputs.test_outcome }}

          if [[ "$TEST_STATUS" == "FAIL" ]]; then
            STATUS_ICON="❌"
            STATUS_TEXT="Failed"
          elif [[ "$TEST_STATUS" == "UNSTABLE" ]]; then
            STATUS_ICON="⚠️"
            STATUS_TEXT="Unstable"
          else
            STATUS_ICON="✅"
            STATUS_TEXT="All tests passed"
          fi

          echo "### 🤖 Hyperscale SSD Framework CI/CD" >> $GITHUB_STEP_SUMMARY
          echo "[![Ubuntu Latest Report](https://img.shields.io/badge/Ubuntu-Latest_Build-blue)](${BASE_URL}/latest/ubuntu-latest/index.html)" >> $GITHUB_STEP_SUMMARY
          echo "[![Windows Latest Report](https://img.shields.io/badge/Windows-Latest_Build-blue)](${BASE_URL}/latest/windows-latest/index.html)" >> $GITHUB_STEP_SUMMARY
          echo "[![Report History](https://img.shields.io/badge/All-Builds-green)](${BASE_URL}/)" >> $GITHUB_STEP_SUMMARY
          echo "Build #${{ github.run_number }} | Status: $STATUS_ICON $STATUS_TEXT" >> $GITHUB_STEP_SUMMARY
