name: Hyperscale SSD CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

env:
  SITE_DIR: site

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        shell: bash
        run: |
          set +e
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y jq
          else
            choco install jq -y || true
          fi
          
      - name: Run Behave Tests
        shell: bash
        run: |
          mkdir -p reports
          # Run tests and try to generate the report
          behave -f pretty -f behave_html_pretty:reports/report.html -o reports/report.html || true

          # --- FIX 1: Explicitly check for the report file to surface errors ---
          if [ ! -f reports/report.html ]; then
            echo "::error::Behave report file reports/report.html was not generated. The test run may have failed completely. Check the logs for the 'Run Behave Tests' step."
            exit 1
          fi
          # --------------------------------------------------------------------

      - name: Extract Test Summary
        # --- FIX 2: Specify shell for Bash syntax on Windows/all runners ---
        shell: bash
        # ------------------------------------------------------------------
        run: |
          TOTAL_PASSED=$(grep -E "passed" reports/report.html | wc -l || echo 0)
          TOTAL_FAILED=$(grep -E "failed" reports/report.html | wc -l || echo 0)
          TOTAL_SKIPPED=$(grep -E "skipped" reports/report.html | wc -l || echo 0)
          jq -n --arg passed "$TOTAL_PASSED" --arg failed "$TOTAL_FAILED" --arg skipped "$TOTAL_SKIPPED" \
             '{passed: $passed|tonumber, failed: $failed|tonumber, unstable: $skipped|tonumber}' > reports/summary.json
          echo "✅ Summary extracted: $(cat reports/summary.json)"

      - name: Upload Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: behave-report-${{ matrix.os }}
          path: reports/

  deploy:
# ... (rest of the deploy job is unchanged)