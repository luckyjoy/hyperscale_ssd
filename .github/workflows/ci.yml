name: Hyperscale SSD CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    name: Run Behave Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install dependencies
      shell: bash
      run: |
        set +e
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        if [[ "${{ runner.os }}" == "Linux" ]]; then
          sudo apt-get update
          sudo apt-get install -y jq
        else
          choco install jq -y || true
        fi

    - name: Run Behave tests
      shell: bash
      run: |
        echo "Running Behave tests..."
        behave -f allure_behave.formatter:AllureFormatter -o reports/allure-results
        # Extract summary
        STATS_LINE=$(tail -n5 reports/allure-results/* | grep -E "scenarios passed|steps passed")
        PASSED=$(echo "$STATS_LINE" | grep -oE "[0-9]+ passed" | grep -oE "[0-9]+")
        FAILED=$(echo "$STATS_LINE" | grep -oE "[0-9]+ failed" | grep -oE "[0-9]+")
        SKIPPED=$(echo "$STATS_LINE" | grep -oE "[0-9]+ skipped" | grep -oE "[0-9]+")
        mkdir -p reports
        echo "{ \"build\": ${{ github.run_number }}, \"passed\": $PASSED, \"failed\": $FAILED, \"skipped\": $SKIPPED }" > reports/summary.json

    - name: Upload Allure Results
      uses: actions/upload-artifact@v4
      with:
        name: allure-results-${{ matrix.os }}
        path: reports/allure-results

  dashboard:
    name: Generate Dashboard
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v3

    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        name: allure-results-ubuntu-latest
        path: artifacts/behave-output-ubuntu-latest
    - uses: actions/download-artifact@v4
      with:
        name: allure-results-windows-latest
        path: artifacts/behave-output-windows-latest

    - name: Generate Dashboard
      shell: bash
      run: python ci/generate_dashboard.py

    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: site

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    - name: Add Workflow Summary (Badges)
      shell: bash
      run: |
        PAGE_URL=${{ steps.deployment.outputs.page_url }}
        BASE_URL="${PAGE_URL%/}"
        TEST_STATUS="UNSTABLE"
        STATUS_ICON="⚠️"
        STATUS_TEXT="Some tests failed"

        echo "### 🤖 Hyperscale SSD Framework CI/CD" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "[![Ubuntu Latest Report](https://img.shields.io/badge/Ubuntu-Latest_Build-blue)](${BASE_URL}/latest/ubuntu-latest/index.html)" >> $GITHUB_STEP_SUMMARY
        echo "[![Windows Latest Report](https://img.shields.io/badge/Windows-Latest_Build-blue)](${BASE_URL}/latest/windows-latest/index.html)" >> $GITHUB_STEP_SUMMARY
        echo "[![Report History](https://img.shields.io/badge/All-Builds-green)](${BASE_URL}/)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Build #${{ github.run_number }} | Status: $STATUS_ICON $STATUS_TEXT" >> $GITHUB_STEP_SUMMARY
