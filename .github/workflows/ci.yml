name: Hyperscale SSD Framework CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Behave Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          set +e
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y jq
          else
            choco install jq -y || true
          fi

      - name: Run Behave Tests (HTML)
        run: |
          echo "Running Behave tests..."
          BUILD_NUMBER=${{ github.run_number }}
          OS_NAME=${{ matrix.os }}
          REPORT_DIR="reports/$BUILD_NUMBER/$OS_NAME"
          mkdir -p "$REPORT_DIR"

          behave --tags=@adv --exclude "features/manual_tests" \
            --format behave_html_pretty_formatter:PrettyHTMLFormatter \
            -o "$REPORT_DIR/report.html" --no-capture || true

          # Ensure summary.json exists
          PASSED=$(grep -o "class=['\"]scenario passed['\"]" "$REPORT_DIR/report.html" | wc -l || echo 0)
          FAILED=$(grep -o "class=['\"]scenario failed['\"]" "$REPORT_DIR/report.html" | wc -l || echo 0)
          SKIPPED=$(grep -o "class=['\"]scenario skipped['\"]" "$REPORT_DIR/report.html" | wc -l || echo 0)

          jq -n --argjson p "$PASSED" --argjson f "$FAILED" --argjson s "$SKIPPED" \
            '{passed: $p, failed: $f, skipped: $s, timestamp: "'$(date -u +'%Y-%m-%dT%H:%M:%SZ')'"}' \
            > "$REPORT_DIR/summary.json"

          echo "✅ Report generated at $REPORT_DIR"
          echo "PASSED=$PASSED, FAILED=$FAILED, SKIPPED=$SKIPPED"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: behave-report-${{ matrix.os }}
          path: reports/${{ github.run_number }}/${{ matrix.os }}/

  generate-dashboard:
    name: Generate Reports & Deploy
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Download Current Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: behave-report-ubuntu-latest
          path: current/ubuntu-latest
      - uses: actions/download-artifact@v4
        with:
          name: behave-report-windows-latest
          path: current/windows-latest

      - name: Merge History and Append Current Build
        run: |
          echo "Merging build history..."
          mkdir -p site/history
          BUILD_ID=$(date -u +'%Y%m%d-%H%M%S')

          for OS in ubuntu-latest windows-latest; do
            mkdir -p site/history/$BUILD_ID/$OS
            cp -r current/$OS/* site/history/$BUILD_ID/$OS/
          done

          SUMMARY_JSON="site/history/summary.json"
          mkdir -p site/history
          if [[ ! -f "$SUMMARY_JSON" ]]; then
            echo "[]" > "$SUMMARY_JSON"
          fi

          # Combine summaries of both OS for this build
          COMBINED_SUMMARY=$(jq -s '.[0] + .[1]' current/ubuntu-latest/summary.json current/windows-latest/summary.json)
          jq --slurpfile new <(echo "$COMBINED_SUMMARY") '. + [{"build":"'"$BUILD_ID"'","data":$new[0]}]' "$SUMMARY_JSON" > site/history/tmp.json
          mv site/history/tmp.json "$SUMMARY_JSON"
          echo "✅ summary.json updated:"
          cat "$SUMMARY_JSON"

      - name: Rebuild Dashboard Index
        run: |
          echo "Rebuilding dashboard index..."
          mkdir -p site
          SUMMARY_JSON="site/history/summary.json"

          echo "<html><head><meta charset='utf-8'><title>Build History Dashboard</title></head><body>" > site/index.html
          echo "<h1>📊 Hyperscale SSD Framework CI/CD Build History</h1>" >> site/index.html
          echo "<table border='1' cellpadding='6'><tr><th>#</th><th>Build</th><th>Passed</th><th>Failed</th><th>Skipped</th><th>Ubuntu Report</th><th>Windows Report</th></tr>" >> site/index.html

          jq -r 'reverse | to_entries[] | "\(.key+1)|\(.value.build)|\(.value.data.passed)|\(.value.data.failed)|\(.value.data.skipped)"' "$SUMMARY_JSON" |
          while IFS="|" read -r idx build passed failed skipped; do
            echo "<tr><td>${idx}</td><td>${build}</td><td>${passed}</td><td>${failed}</td><td>${skipped}</td>" \
                 "<td><a href='history/${build}/ubuntu-latest/report.html'>View</a></td>" \
                 "<td><a href='history/${build}/windows-latest/report.html'>View</a></td></tr>" >> site/index.html
          done

          echo "</table></body></html>" >> site/index.html
          echo "✅ Dashboard rebuilt at site/index.html"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          publish_branch: gh-pages
