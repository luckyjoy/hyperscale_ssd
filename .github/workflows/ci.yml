name: Hyperscale SSD Framework CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

env:
  SITE_DIR: site

jobs:
  test:
    name: Run tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    outputs:
      test_outcome: ${{ steps.run_behave_tests.outputs.test_outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        shell: bash
        run: |
          set +e
          python -m pip install --upgrade pip
          pip install -r requirements.txt behave-html-pretty-formatter jq
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            choco install jq -y || true
          fi

      - name: Run Behave Tests
        id: run_behave_tests
        shell: bash
        run: |
          set -euo pipefail || true
          OS_NAME=${{ matrix.os }}
          BUILD_NUMBER=${{ github.run_number }}
          REPORT_DIR="reports/$BUILD_NUMBER/$OS_NAME"
          mkdir -p "$REPORT_DIR"

          echo ">>> Running behave on $OS_NAME, build $BUILD_NUMBER"
          behave --tags=@adv --exclude "features/manual_tests" \
            --format behave_html_pretty_formatter:PrettyHTMLFormatter \
            -o "$REPORT_DIR/validation_report.html" --no-capture | tee /tmp/behave_output.txt || true

          TEST_EXIT_CODE=${PIPESTATUS[0]:-0} || true
          if [ "$TEST_EXIT_CODE" -ne 0 ]; then
            if grep -q "failed" /tmp/behave_output.txt 2>/dev/null; then
              RESULT=UNSTABLE
            else
              RESULT=FAIL
            fi
          else
            RESULT=PASS
          fi

          echo "test_outcome=$RESULT" >> $GITHUB_OUTPUT
          echo "$RESULT" > "$REPORT_DIR/status.txt"
          echo "$(TZ='America/Los_Angeles' date)" > "$REPORT_DIR/timestamp.txt"

          # Parse Behave summary line
          SUMMARY_LINE=$(grep -E 'scenarios? ' /tmp/behave_output.txt | tail -n 1 || true)
          PASSED_COUNT=$(echo "$SUMMARY_LINE" | grep -Eo '[0-9]+ passed' | grep -Eo '[0-9]+' || echo 0)
          FAILED_COUNT=$(echo "$SUMMARY_LINE" | grep -Eo '[0-9]+ failed' | grep -Eo '[0-9]+' || echo 0)
          BROKEN_COUNT=$([ "$RESULT" = "UNSTABLE" ] && echo 1 || echo 0)

          jq -n --argjson p "$PASSED_COUNT" --argjson f "$FAILED_COUNT" --argjson b "$BROKEN_COUNT" \
            '{statistic:{passed:$p,failed:$f,broken:$b}}' > "$REPORT_DIR/summary.json"

          echo "Summary JSON for $OS_NAME:"
          cat "$REPORT_DIR/summary.json"

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: reports/${{ github.run_number }}/${{ matrix.os }}/

  report:
    name: Generate Reports & Deploy
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install JQ
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Download previous history
        uses: actions/download-artifact@v4
        with:
          name: history
          path: previous-site
          if-no-artifact-found: ignore

      - name: Restore previous builds (cross-platform safe)
        shell: bash
        run: |
          SITE_DIR="${{ env.SITE_DIR }}"
          mkdir -p "$SITE_DIR"
          if [ -d "previous-site" ]; then
            echo "Merging previous-site into $SITE_DIR..."
            cp -R previous-site/* "$SITE_DIR/" || true
          fi

      - name: Download current test results
        uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Integrate new reports
        shell: bash
        run: |
          set -euo pipefail || true
          SITE_DIR="site"
          BUILD_NUMBER=${{ github.run_number }}
          mkdir -p "$SITE_DIR/latest"

          for OS in ubuntu-latest windows-latest; do
            SRC_DIR="reports/build-$OS"
            DEST_BUILD="$SITE_DIR/$BUILD_NUMBER/$OS"
            DEST_LATEST="$SITE_DIR/latest/$OS"

            mkdir -p "$DEST_BUILD" "$DEST_LATEST"
            cp -R "$SRC_DIR/"* "$DEST_BUILD/" || true

            if [ -f "$DEST_BUILD/validation_report.html" ]; then
              cp "$DEST_BUILD/validation_report.html" "$DEST_LATEST/index.html"
            fi

            if [ -f "$DEST_BUILD/summary.json" ]; then
              cp "$DEST_BUILD/summary.json" "$DEST_LATEST/summary.json"
            else
              jq -n '{statistic:{passed:0,failed:0,broken:0}}' > "$DEST_BUILD/summary.json"
              cp "$DEST_BUILD/summary.json" "$DEST_LATEST/summary.json"
            fi

            date -u > "$DEST_BUILD/build-info.txt"
            date -u > "$DEST_LATEST/build-info.txt"

            REPO_NAME="${GITHUB_REPOSITORY##*/}"
            echo "{\"name\":\"$OS\",\"type\":\"GitHub Actions\",\"url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\",\"reportUrl\":\"https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/latest/$OS/\",\"buildOrder\":\"${BUILD_NUMBER}\",\"buildName\":\"Build ${BUILD_NUMBER} ($OS)\",\"buildUrl\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" > "$DEST_LATEST/executor.json"
          done

      - name: Generate Build History Dashboard
        shell: bash
        run: |
          set -euo pipefail || true
          SITE_DIR="site"
          CURRENT_TIME=$(TZ='America/Los_Angeles' date)

          # Start index.html
          echo "<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Build History</title>
          <script src='https://cdn.jsdelivr.net/npm/chart.js'></script>
          <style>body{font-family:sans-serif;margin:20px;}a{color:#0366d6;text-decoration:none;}a:hover{text-decoration:underline;}#chart-container{max-width:900px;max-height:500px;}</style>
          </head><body><h1>🤖 Hyperscale SSD Framework CI/CD Build History</h1>" > "$SITE_DIR/index.html"

          echo "<h2>🧩 Latest Reports</h2><ul>" >> "$SITE_DIR/index.html"
          for OS in ubuntu-latest windows-latest; do
            if [ -d "$SITE_DIR/latest/$OS" ]; then
              echo "<li><a href='latest/$OS/'>Latest Report ($OS)</a></li>" >> "$SITE_DIR/index.html"
            fi
          done
          echo "</ul><hr><h2>📊 Report History & Trends (Times in PDT)</h2><ul>" >> "$SITE_DIR/index.html"

          BUILDS=$(find "$SITE_DIR" -mindepth 1 -maxdepth 1 -type d -regex '.*/[0-9]+' | sort -nr)
          LABELS=""; PASS=""; FAIL=""; UNSTABLE=""

          for BUILD in $BUILDS; do
            BUILD_NUM=$(basename "$BUILD")
            echo "<li><a href='${BUILD_NUM}/ubuntu-latest/'>Build #$BUILD_NUM</a></li>" >> "$SITE_DIR/index.html"

            P=0; F=0; B=0
            for OS in ubuntu-latest windows-latest; do
              SUMMARY="$SITE_DIR/$BUILD_NUM/$OS/summary.json"
              if [ -f "$SUMMARY" ]; then
                p=$(jq -r '.statistic.passed // 0' "$SUMMARY")
                f=$(jq -r '.statistic.failed // 0' "$SUMMARY")
                b=$(jq -r '.statistic.broken // 0' "$SUMMARY")
                P=$((P + p)); F=$((F + f)); B=$((B + b))
              fi
            done

            LABELS="$LABELS'$BUILD_NUM',"
            PASS="$PASS$P,"
            FAIL="$FAIL$F,"
            UNSTABLE="$UNSTABLE$B,"
          done

          echo "</ul><div id='chart-container'><canvas id='trendChart'></canvas></div>
          <script>
          const ctx=document.getElementById('trendChart').getContext('2d');
          new Chart(ctx,{type:'line',data:{labels:[${LABELS%,}],
          datasets:[{label:'PASS',data:[${PASS%,}],borderColor:'green',fill:false},
          {label:'FAIL',data:[${FAIL%,}],borderColor:'red',fill:false},
          {label:'UNSTABLE',data:[${UNSTABLE%,}],borderColor:'orange',fill:false}]},
          options:{responsive:true,scales:{y:{beginAtZero:true}}}});
          </script><hr><p><em>Generated automatically on $CURRENT_TIME</em></p></body></html>" >> "$SITE_DIR/index.html"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload History for next run
        uses: actions/upload-artifact@v4
        with:
          name: history
          path: site
          retention-days: 7
