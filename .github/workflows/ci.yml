name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        shell: bash
        run: |
          set +e
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y jq
          else
            choco install jq -y || true
          fi

      - name: Run Behave Tests (HTML)
        shell: bash
        run: |
          echo "Running Behave tests..."
          mkdir -p reports
          behave -f html -o reports/report.html || true
          if [[ -f "reports/report.html" ]]; then
            echo "✅ HTML report generated at reports/report.html"
          else
            echo "⚠️ No HTML report found — generating empty placeholder."
            echo "<html><body><h2>No tests were executed.</h2></body></html>" > reports/report.html
          fi

      - name: Extract Summary (Passed/Failed/Skipped)
        shell: bash
        run: |
          echo "Extracting report summary..."
          REPORT_FILE="reports/report.html"
          if [[ -f "$REPORT_FILE" ]]; then
            PASSED=$(grep -o "class=['\"]scenario passed['\"]" "$REPORT_FILE" | wc -l || echo 0)
            FAILED=$(grep -o "class=['\"]scenario failed['\"]" "$REPORT_FILE" | wc -l || echo 0)
            SKIPPED=$(grep -o "class=['\"]scenario skipped['\"]" "$REPORT_FILE" | wc -l || echo 0)
          else
            echo "⚠️ No report.html found — setting all counts to 0."
            PASSED=0; FAILED=0; SKIPPED=0
          fi

          echo "{ \"passed\": $PASSED, \"failed\": $FAILED, \"skipped\": $SKIPPED, \"timestamp\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\" }" > reports/summary.json
          echo "✅ Summary generated:"
          cat reports/summary.json

      - name: Upload Artifacts (Report + Summary)
        uses: actions/upload-artifact@v4
        with:
          name: behave-report
          path: reports/

  generate-dashboard:
    runs-on: ubuntu-latest
    needs: test-and-report
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Current Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: behave-report
          path: current/

      - name: Download Previous Build History (if exists)
        shell: bash
        run: |
          echo "Fetching previous dashboard build..."
          mkdir -p site/history
          git fetch origin gh-pages:gh-pages || true
          if git rev-parse --verify gh-pages >/dev/null 2>&1; then
            git checkout gh-pages
            cp -r history site/ || echo "⚠️ No previous history found."
          else
            echo "⚠️ No gh-pages branch found, initializing fresh site."
          fi
          git checkout main

      - name: Merge History and Append Current Build
          shell: bash
          run: |
            echo "Merging build history..."
            mkdir -p site/history
            BUILD_ID=$(date -u +'%Y%m%d-%H%M%S')
            mkdir -p site/history/$BUILD_ID
            cp -r current/* site/history/$BUILD_ID/

            SUMMARY_JSON="site/history/summary.json"

            # ensure current summary is valid JSON
            CURRENT_SUMMARY=$(cat current/summary.json | jq .)

            if [[ -f "$SUMMARY_JSON" ]]; then
              # read existing summary as array
              EXISTING=$(jq . "$SUMMARY_JSON")
              # append new build
              echo "$EXISTING + [{\"build\":\"$BUILD_ID\",\"data\":$CURRENT_SUMMARY}]" | jq . > "$SUMMARY_JSON"
            else
              # create new summary.json
              echo "[{\"build\":\"$BUILD_ID\",\"data\":$CURRENT_SUMMARY}]" | jq . > "$SUMMARY_JSON"
            fi

            echo "✅ summary.json updated:"
            cat "$SUMMARY_JSON"

      - name: Rebuild Dashboard Index
        shell: bash
        run: |
          echo "Rebuilding dashboard index..."
          mkdir -p site
          SUMMARY_JSON="site/history/summary.json"
          echo "<html><head><meta charset='utf-8'><title>Build History Dashboard</title></head><body>" > site/index.html
          echo "<h1>📊 Report History & Trends (Times in PDT)</h1>" >> site/index.html
          echo "<table border='1' cellpadding='6'><tr><th>#</th><th>Build</th><th>Passed</th><th>Failed</th><th>Skipped</th><th>Link</th></tr>" >> site/index.html

          jq -r 'reverse | to_entries[] | "\(.key+1)|\(.value.build)|\(.value.data.passed)|\(.value.data.failed)|\(.value.data.skipped)"' "$SUMMARY_JSON" |
          while IFS="|" read -r idx build passed failed skipped; do
            echo "<tr><td>${idx}</td><td>${build}</td><td>${passed}</td><td>${failed}</td><td>${skipped}</td><td><a href='history/${build}/report.html'>View</a></td></tr>" >> site/index.html
          done

          echo "</table></body></html>" >> site/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          publish_branch: gh-pages
