name: Hyperscale SSD CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: Run Behave Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set +e
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install behave-html-pretty || true
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y jq
          else
            choco install jq -y || true
          fi

      - name: Run Behave Tests
        shell: bash
        run: |
          echo "Running Behave tests..."
          BUILD_NUMBER=${{ github.run_number }}
          OS_NAME=${{ matrix.os }}
          REPORT_DIR="reports/$BUILD_NUMBER/$OS_NAME"
          mkdir -p "$REPORT_DIR"

          BEHAVE_OUTPUT=$(mktemp)
          behave --tags=@adv --exclude "features/manual_tests" \
            --format behave_html_pretty_formatter:PrettyHTMLFormatter \
            -o "$REPORT_DIR/report.html" --no-capture | tee "$BEHAVE_OUTPUT" || true

          STATS_LINE=$(grep -E 'scenarios?' "$BEHAVE_OUTPUT" | tail -1)
          echo "Detected stats line: $STATS_LINE"

          PASSED=$(echo "$STATS_LINE" | grep -Po '(\d+)\s+scenarios?\s+passed' | grep -Po '\d+' | head -1)
          FAILED=$(echo "$STATS_LINE" | grep -Po '(\d+)\s+failed' | grep -Po '\d+' | head -1)
          SKIPPED=$(echo "$STATS_LINE" | grep -Po '(\d+)\s+skipped' | grep -Po '\d+' | head -1)

          PASSED=${PASSED:-0}
          FAILED=${FAILED:-0}
          SKIPPED=${SKIPPED:-0}

          PASSED=$((PASSED))
          FAILED=$((FAILED))
          SKIPPED=$((SKIPPED))

          jq -n --argjson p "$PASSED" --argjson f "$FAILED" --argjson s "$SKIPPED" \
            '{passed:$p, failed:$f, skipped:$s, os:"'${OS_NAME}'", build:"'${BUILD_NUMBER}'", timestamp:"'$(date -u +'%Y-%m-%dT%H:%M:%SZ')'"}' \
            > "$REPORT_DIR/summary.json"

          echo "✅ summary.json generated:"
          cat "$REPORT_DIR/summary.json"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: reports/${{ github.run_number }}/${{ matrix.os }}/

  merge:
    name: Merge Build History
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: history/

      - name: Merge summaries
        shell: bash
        run: |
          echo "Merging summaries..."
          mkdir -p site
          CURRENT_SUMMARY=$(find history -name summary.json -type f)

          if [[ -f site/history.json ]]; then
            jq -s 'add' site/history.json $CURRENT_SUMMARY > site/merged.json
          else
            jq -s 'add' $CURRENT_SUMMARY > site/merged.json
          fi

          mv site/merged.json site/history.json
          echo "✅ Updated site/history.json:"
          cat site/history.json

      - name: Generate dashboard index.html
        shell: bash
        run: |
          echo "Rebuilding dashboard..."
          BUILD_TABLE=$(jq -r '
            ["#", "Build", "Passed", "Failed", "Skipped", "Ubuntu", "Windows"],
            (to_entries | reverse | map(
              [.key + 1,
               .value.build,
               .value.passed,
               .value.failed,
               .value.skipped,
               (if .value.os == "ubuntu-latest" then "View" else "" end),
               (if .value.os == "windows-latest" then "View" else "" end)
              ]
            )[]) | @tsv' site/history.json)

          {
            echo "<html><head><title>Hyperscale SSD Build Dashboard</title></head><body>"
            echo "<h2>Report History & Trends (Times in PDT)</h2><pre>$BUILD_TABLE</pre>"
            echo "</body></html>"
          } > site/index.html

          echo "✅ Dashboard index.html generated."

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
